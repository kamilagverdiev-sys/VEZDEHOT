/* VEZDEHOT motion layer: clear state changes without external dependencies */
.motion-in .intro,.motion-in .board-wrap,.motion-in .side,.motion-in .result{animation:surfaceIn .42s cubic-bezier(.2,.8,.2,1) both}
.motion-in .cell{animation:cellIn .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*18ms)}
.motion-in .player-row{animation:rowIn .32s ease both;animation-delay:calc(var(--i,0)*28ms)}
.board-wrap{position:relative}
.board-wrap.is-moving{border-color:rgba(112,202,255,.55);box-shadow:inset 0 0 0 5px rgba(112,202,255,.05),0 0 28px rgba(112,202,255,.18),0 20px 46px rgba(0,0,0,.26)}
.board-wrap.is-moving .board{animation:boardGlow .9s ease-in-out infinite alternate}
.cell.landed{position:relative;z-index:2}
.motion-in .cell.landed{animation:land .7s cubic-bezier(.2,.9,.25,1) both}
.cell.landed:after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.55);opacity:0;pointer-events:none;animation:landRing .75s ease-out both}
.dice-big{animation:diceIdle 3.6s ease-in-out infinite}
.dice-result{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.055);transition:background .2s,transform .2s}
.dice-result.rolling{background:rgba(112,202,255,.16);animation:diceRoll .52s cubic-bezier(.2,.8,.2,1) infinite}
.action-panel{transition:border-color .2s,box-shadow .2s}
.board-wrap.is-moving~.side .action-panel{border-color:rgba(112,202,255,.4);box-shadow:0 0 20px rgba(112,202,255,.1)}
.toast-stack{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:80;display:grid;gap:8px;width:min(340px,calc(100vw - 28px));pointer-events:none}
.toast{padding:11px 13px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(19,15,36,.94);box-shadow:0 16px 38px rgba(0,0,0,.32);color:#f8f4ff;font-size:13px;font-weight:750;animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both}
.toast.success{border-color:rgba(123,229,173,.5);background:rgba(18,64,55,.94)}
.toast.danger{border-color:rgba(255,111,168,.5);background:rgba(72,24,53,.94)}
.toast.out{animation:toastOut .25s ease both}
.fx-layer{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:none}
.fx-layer i{position:absolute;left:var(--x);top:35%;width:8px;height:14px;border-radius:3px;background:hsl(calc(var(--i)*25),85%,68%);box-shadow:0 0 10px rgba(255,255,255,.22);animation:confetti 1.25s cubic-bezier(.15,.8,.2,1) var(--delay) forwards;transform:rotate(var(--rot))}
.fx-layer.loss i{background:#ff6f9d}

@keyframes cellIn{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}

@keyframes landRing{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.18)}}
@keyframes diceIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

function move(p,steps){var old=p.pos;var passed=false;for(var i=0;i<steps;i++){p.pos=(p.pos+1)%game.board.length;if(p.pos===0)passed=true}if(passed){addMoney(p,200);game.log.unshift(p.name+' прошёл Старт · +200 🪙')}return old!==p.pos}
function chance(p){var e=chances[Math.floor(Math.random()*chances.length)];if(e.delta){if(e.delta>0){addMoney(p,e.delta);game.log.unshift(p.name+' получил шанс: +'+e.delta+' 🪙')}else{var loss=Math.min(p.money,-e.delta);p.money-=loss;game.log.unshift(p.name+' попал на штраф: -'+loss+' 🪙');if(p.money<=0)bankrupt(p,'штраф шанса')}}else if(e.move){move(p,e.move);game.log.unshift(p.name+' получает шанс: вперёд на '+e.move+' клетки')}return e.text}
function land(p,idx,bot){var c=game.board[idx];game.lastIndex=idx;if(!p.alive)return;if(c.kind==='start'){addMoney(p,80);game.log.unshift(p.name+' остановился на Старте · +80 🪙')}else if(c.kind==='bonus'){addMoney(p,c.amount);game.log.unshift(p.name+' нашёл Оазис · +'+c.amount+' 🪙')}else if(c.kind==='tax'){var paid=Math.min(p.money,c.amount);p.money-=paid;game.log.unshift(p.name+' заплатил '+paid+' 🪙 налога');if(p.money<=0)bankrupt(p,'налог')}else if(c.kind==='chance'){var text=chance(p);game.message=p.name+': '+text}else if(c.kind==='goto'){p.pos=6;game.log.unshift(p.name+' отправлен на Паузы')}else if(c.kind==='jail'){game.log.unshift(p.name+' отдыхает один ход · но штрафа нет')}else if(c.kind==='property'){if(c.owner===null){if(bot){if(p.money>c.price+240||Math.random()>.48)purchase(p,idx)}else{game.phase='humanBuy';game.message='Свободная собственность. Купить её?'}}else if(c.owner!==game.players.indexOf(p)){var owner=game.players[c.owner];var rent=c.rent;if(owner.properties.length>=3)rent=Math.floor(rent*1.25);transfer(p,owner,rent,'аренда «'+c.title+'»');if(!p.alive&&p===game.players[0])return}else{game.message=p.name+' вернулся на свою собственность · аренды нет';game.log.unshift(p.name+' удержал «'+c.title+'»')}}}
function roll(){if(!game||game.over||game.turn!==0||game.phase!=='humanRoll')return;game.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];game.rolled=true;game.phase='moving';game.message='Кубики выпали: '+game.dice[0]+' + '+game.dice[1];render();setTimeout(function(){if(!game||game.over)return;move(game.players[0],game.dice[0]+game.dice[1]);land(game.players[0],game.players[0].pos,false);if(game.over)return;if(game.phase!=='humanBuy')game.phase='humanEnd';render()},430)}
function buy(){if(!game||game.over||game.phase!=='humanBuy')return;var p=game.players[0];if(p.money<game.board[p.pos].price){game.message='Недостаточно монет для покупки';game.phase='humanEnd'}else purchase(p,p.pos),game.message='Собственность твоя. Передай ход',game.phase='humanEnd';render()}
function skipBuy(){if(!game||game.over||game.phase!=='humanBuy')return;game.message='Ты пропустил покупку';game.phase='humanEnd';render()}
function endTurn(){if(!game||game.over||game.turn!==0||game.phase!=='humanEnd')return;if(alivePlayers().length<=1){finish(game.players[0].alive);return}game.turn=nextAlive(0);game.phase=game.turn===0?'humanRoll':'botRoll';game.rolled=false;render();if(game.turn!==0)setTimeout(botTurn,550)}
function botTurn(){if(!game||game.over||game.turn===0)return;var p=game.players[game.turn];if(!p||!p.alive){game.turn=nextAlive(game.turn);game.phase=game.turn===0?'humanRoll':'botRoll';render();if(game.turn!==0)setTimeout(botTurn,400);return}game.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];game.phase='moving';game.message=p.name+' бросает кубики: '+game.dice[0]+' + '+game.dice[1];render();setTimeout(function(){if(!game||game.over)return;move(p,game.dice[0]+game.dice[1]);land(p,p.pos,true);if(game.over)return;game.turn=nextAlive(game.turn);game.phase=game.turn===0?'humanRoll':'botRoll';game.message=game.turn===0?'Твой ход: бросай кубики':game.players[game.turn].name+' готовится к ходу';render();if(game.turn!==0)setTimeout(botTurn,660)},500)}
function motionReduced(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function replayMotion(){var app=document.getElementById('app');if(!app)return;app.classList.remove('motion-in');void app.offsetWidth;app.classList.add('motion-in')}
function vezToast(text,tone){if(!text)return;var stack=document.querySelector('.toast-stack');if(!stack){stack=document.createElement('div');stack.className='toast-stack';stack.setAttribute('aria-live','polite');document.body.appendChild(stack)}var item=document.createElement('div');item.className='toast '+(tone||'');item.textContent=text;stack.appendChild(item);setTimeout(function(){item.classList.add('out');setTimeout(function(){item.remove()},260)},3400)}
function burst(kind){if(motionReduced())return;var layer=document.createElement('div');layer.className='fx-layer '+(kind||'win');layer.setAttribute('aria-hidden','true');for(var i=0;i<20;i++){var bit=document.createElement('i');bit.style.setProperty('--i',i);bit.style.setProperty('--x',(Math.random()*100).toFixed(1)+'%');bit.style.setProperty('--delay',(Math.random()*140).toFixed(0)+'ms');bit.style.setProperty('--rot',(Math.random()*70-35).toFixed(1)+'deg');layer.appendChild(bit)}document.body.appendChild(layer);setTimeout(function(){layer.remove()},1700)}
function finish(won){if(!game||game.over)return;game.over=true;game.winner=won?0:(alivePlayers()[0]===game.players[0]?0:null);game.phase='over';if(won){balance+=250;saved.wins=(saved.wins||0)+1;saved.xp=(saved.xp||0)+100;game.message='Ты выиграл Монополию · +150 чистыми 🪙'}else{saved.xp=(saved.xp||0)+25;game.message='Ты обанкротился. Попробуй другой маршрут.'}saved.games=(saved.games||0)+1;save();render();vezToast(game.message,won?'success':'danger');if(won)burst('win')}
function escCellName(x){return esc(x).replace(/«/g,'&laquo;').replace(/»/g,'&raquo;')}
function cellHtml(c,i){var owner=c.owner===null?null:game.players[c.owner],tokens=game.players.filter(function(p){return p.alive&&p.pos===i}).map(function(p){return '<span class="token '+(p.kind==='human'?'human':'bot')+'" title="'+esc(p.name)+'">'+p.face+'</span>'}).join('');var cls='cell '+(c.kind==='property'?'prop '+c.color:'')+(owner?(owner.kind==='human'?' owned-h':' owned-b'):'')+(game.lastIndex===i?' landed':'')+(game.players.some(function(p){return p.alive&&p.pos===i&&p===game.players[game.turn]})?' active':'');var meta=c.kind==='property'?c.price+' · аренда '+c.rent:c.kind==='tax'?'−'+c.amount+' 🪙':c.kind==='bonus'?'+'+c.amount+' 🪙':c.kind==='start'?'+80 при остановке':'';return '<div class="'+cls+'" style="--i:'+i+'"><div class="stripe"></div><div class="kind">'+(c.icon||'🏙️')+'</div><span class="name">'+escCellName(c.title)+'</span><span class="meta">'+meta+'</span>'+ (owner?'<span class="ownership '+(owner.kind==='bot'?'bot':'')+'" title="Владелец: '+esc(owner.name)+'"></span>':'')+'<div class="tokens">'+tokens+'</div></div>'}
function playersHtml(){return game.players.map(function(p,i){return '<div class="player-row '+(!p.alive?'out ':'')+(game.turn===i&&!game.over?'turn':'')+'"><span class="avatar">'+p.face+'</span><div><b>'+esc(p.name)+(i===0?' · ты':'')+'</b><small>'+(!p.alive?'банкрот':(game.turn===i&&!game.over?'ходит сейчас':'позиция '+(p.pos+1)+' · '+p.properties.length+' актив.'))+'</small></div><div class="row-money">'+fmt(p.money)+' 🪙</div></div>'}).join('')}
function controls(){if(game.over)return '<button class="btn primary" data-new>Новая партия</button><a class="btn" href="./index.html">В лобби</a>';if(game.turn!==0)return '<button class="btn" disabled>Ход бота…</button>';if(game.phase==='humanRoll')return '<button class="btn primary" data-roll>🎲 Бросить кубики</button>';if(game.phase==='moving')return '<button class="btn" disabled>⏳ Фишка движется…</button>';if(game.phase==='humanBuy')return '<div class="property-action"><b>Купить «'+esc(game.board[game.players[0].pos].title)+'» за '+fmt(game.board[game.players[0].pos].price)+' 🪙?</b><small>Аренда принесёт '+game.board[game.players[0].pos].rent+' 🪙 сопернику.</small><div class="actions"><button class="btn green" data-buy>Купить</button><button class="btn" data-skip>Пропустить</button></div></div>';return '<button class="btn primary" data-end>Передать ход</button>'}
function render(override){var app=document.getElementById('app');replayMotion();if(!game){app.innerHTML='<div class="top"><a class="back" href="./index.html">‹ Лобби</a><div class="brand">VEZDEHOT</div><div class="grow"></div><div class="balance">'+fmt(balance)+' 🪙</div></div><div class="head"><div><div class="eyebrow">VEZDEHOT · SOLO MODE</div><h1>Монополия</h1><p>Купи лучшие клетки, собирай аренду и обгони трёх ботов.</p></div></div><div class="note">'+esc(override||'Быстрая партия на 20 клеток. Старт — 1 500 🪙, вход — 100 🪙.')+'</div><section class="panel intro"><div class="intro-grid"><div><h2>Твоя стратегия — твой капитал</h2><p>Каждый ход бросай кубики, решай, покупать ли собственность, и следи за балансом. Рамка на поле показывает, чей сейчас ход.</p><div class="rules"><div class="rule"><span>🏙️</span><div><b>Собственности</b><small>Купи клетку — соперники платят аренду при остановке.</small></div></div><div class="rule"><span>🎲</span><div><b>Шансы и события</b><small>На поле есть бонусы, налоги и случайные карты.</small></div></div><div class="rule"><span>🏆</span><div><b>Победа</b><small>Останься последним игроком с деньгами. Победа даёт +150 чистыми.</small></div></div></div></div><div class="dice-card"><div class="dice-big">🎲</div><button class="btn primary" data-start>Начать за 100 🪙</button><div class="tips"><span class="tip" title="Ставка списывается сразу">💡 Вход 100</span><span class="tip">🤖 3 бота</span></div></div></div></section><div class="tips"><span class="tip">🟢 зелёный маркер — твоя собственность</span><span class="tip">🔴 красный маркер — собственность бота</span><span class="tip">🟡 рамка — активный ход</span></div>';var b=document.querySelector('[data-start]');if(b)b.onclick=startGame;return}var me=game.players[0],alive=alivePlayers().length;app.innerHTML='<div class="top"><a class="back" href="./index.html">‹ Лобби</a><div class="brand">VEZDEHOT</div><div class="grow"></div><div class="balance">'+fmt(balance)+' 🪙</div></div><div class="head"><div><div class="eyebrow">МОНОПОЛИЯ · '+alive+' ИГРОКА В ИГРЕ</div><h1>Монополия</h1><p>Купи рынок и оставь ботов без капитала.</p></div><div class="status">'+(game.over?(game.winner===0?'ПОБЕДА':'БАНКРОТСТВО'):game.turn===0?'ТВОЙ ХОД':'ХОД БОТА')+'<span class="dice-result '+(game.phase==='moving'?'rolling':'')+'">🎲 '+game.dice[0]+' + '+game.dice[1]+'</span></div></div><div class="note '+(game.phase==='moving'?'pulse':'')+'">'+esc(game.message)+'</div><div class="game-grid"><section class="board-wrap '+(game.phase==='moving'?'is-moving':'')+'"><div class="board-head"><div><h2>Город VEZDEHOT</h2><small>Клетка с маркером показывает владельца</small></div><div class="grow"></div><span class="mini-badge">ход '+(game.turn+1)+'/4</span></div><div class="board">'+game.board.map(cellHtml).join('')+'</div><div class="legend"><span>🟡 ты</span><span>🔵 боты</span><span>💸 аренда списывается автоматически</span></div></section><aside class="side"><section class="panel players"><h3>Игроки и капитал</h3>'+playersHtml()+'</section><section class="panel log"><h3>Лента событий</h3><div class="log-list">'+game.log.map(function(x){return '<div class="log-item">'+esc(x)+'</div>'}).join('')+'</div></section><section class="panel action-panel" style="padding:13px"><h3 style="margin:0 0 8px;font-size:14px">Действие</h3>'+controls()+'</section></aside></div>'+(game.over?'<section class="result"><h2>'+ (game.winner===0?'🏆 Ты забрал город':'💥 Капитал закончился') +'</h2><p>'+esc(game.message)+'</p><div class="actions"><button class="btn primary" data-new>Новая партия</button><a class="btn" href="./index.html">В лобби</a></div></section>':'')+'<div class="tips"><span class="tip">💡 покупай клетки, если после сделки останется запас 240 🪙</span><span class="tip">✨ на Оазисе +120, на Старте +80</span></div>';var r=document.querySelector('[data-roll]');if(r)r.onclick=roll;var by=document.querySelector('[data-buy]');if(by)by.onclick=buy;var sk=document.querySelector('[data-skip]');if(sk)sk.onclick=skipBuy;var en=document.querySelector('[data-end]');if(en)en.onclick=endTurn;document.querySelectorAll('[data-new]').forEach(function(x){x.onclick=function(){game=null;render()}})}
render();window.addEventListener('load',function(){initCloud()},{once:true});window.addEventListener('beforeunload',function(){save()});
})();
</script>
