<script>
(function(){'use strict';
var KEY='vezdehot_v2',GAME_KEY='vezdehot_monopoly_v3',saved={},balance=10000,game=null,timer=null,ticket=0,initialized=false,accountChanging=false,selectedIndex=null,detailTab="property",ledgerPlayer=0,visualSnapshot=null,visual={cash:[],moved:[],phase:false};
var colors=['#ef779b','#79a9ff','#66d5ad','#edc46f'],botNames=['Мира','Кекс','Рэй'];

var boardTemplate=[{kind:'start',title:'Старт'},{kind:'property',title:'Маяк',price:120,rent:22,color:'pink'},{kind:'property',title:'Оранжерея',price:140,rent:26,color:'pink'},{kind:'chance',title:'Шанс'},{kind:'tax',title:'Налог',amount:100},{kind:'property',title:'Космопорт',price:170,rent:32,color:'blue'},{kind:'jail',title:'Тихий двор'},{kind:'property',title:'Станция',price:190,rent:38,color:'blue'},{kind:'property',title:'Сад на крыше',price:210,rent:44,color:'green'},{kind:'chance',title:'Шанс'},{kind:'property',title:'Кинотеатр',price:230,rent:50,color:'green'},{kind:'goto',title:'На отдых'},{kind:'property',title:'Арт-кластер',price:260,rent:58,color:'orange'},{kind:'property',title:'Лофт 404',price:280,rent:64,color:'orange'},{kind:'tax',title:'Суперналог',amount:150},{kind:'property',title:'Панорама',price:310,rent:72,color:'purple'},{kind:'chance',title:'Шанс'},{kind:'property',title:'Неон-сквер',price:340,rent:82,color:'purple'},{kind:'bonus',title:'Оазис',amount:120},{kind:'property',title:'Главный хаб',price:380,rent:96,color:'purple'}];

function esc(x){return String(x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function profile(){if(window.VEZDEHOT)return window.VEZDEHOT.getProfile();try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function writable(){return !accountChanging&&(!window.VEZDEHOT_TAB_SESSION||window.VEZDEHOT_TAB_SESSION.canWrite())}
function sessionScope(){return window.VEZDEHOT&&typeof window.VEZDEHOT.scopeKey==='function'?window.VEZDEHOT.scopeKey():'guest'}
function profilePatch(patch){if(!writable())return false;try{if(window.VEZDEHOT){var result=window.VEZDEHOT.updateProfile(patch);if(result&&result.ok===false)return false}else{var latest=profile();Object.assign(latest,patch);localStorage.setItem(KEY,JSON.stringify(latest))}saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:10000;return true}catch(e){return false}}
function save(){if(!writable()||!initialized)return false;if(window.VEZDEHOT_GAME_STORE){var result=game?window.VEZDEHOT_GAME_STORE.save('monopoly',sessionScope(),game,{validate:restore}):window.VEZDEHOT_GAME_STORE.clear('monopoly',sessionScope());return result.ok}try{localStorage.setItem(GAME_KEY,JSON.stringify(game));return true}catch(e){return false}}
function loadGame(){if(window.VEZDEHOT_GAME_STORE)return window.VEZDEHOT_GAME_STORE.load('monopoly',sessionScope(),{validate:restore,legacyKeys:[GAME_KEY]});try{var stored=JSON.parse(localStorage.getItem(GAME_KEY)||'null'),restored=restore(stored);return{state:restored,status:stored&&!restored?'corrupt':restored?'saved':'empty',message:stored&&!restored?'Сохранённую партию не удалось восстановить. Профиль и история на месте.':''}}catch(e){return{state:null,status:'unavailable',message:'Сохранённую партию не удалось прочитать. Профиль и история на месте.'}}}
function cancelTimer(){if(timer!==null)clearTimeout(timer);timer=null;ticket++}
function canRun(g){return writable()&&game===g&&!g.over&&!g.paused&&!document.hidden}
function schedule(fn,delay){cancelTimer();var g=game,epoch=ticket;if(!g||!canRun(g))return;timer=setTimeout(function(){timer=null;if(epoch!==ticket||!canRun(g))return;fn()},delay)}
function log(text){if(!Array.isArray(game.journal))game.journal=(game.log||[]).map(function(value){return{turn:null,text:value}});game.message=text;game.log.unshift(text);game.log=game.log.slice(0,60);game.journal.unshift({turn:game.turnNumber,text:text});game.journal=game.journal.slice(0,60)}
function cashEntry(p,delta,label){if(!delta)return;if(!Array.isArray(game.ledger))game.ledger=[];game.ledger.unshift({player:p.id,delta:delta,label:label,turn:game.turnNumber,balance:p.money});game.ledger=game.ledger.slice(0,240)}
function cloneBoard(){return boardTemplate.map(function(c){return Object.assign({},c,{owner:null})})}
function makePlayer(name,id){return{id:id,name:name,money:1500,pos:0,alive:true,properties:[],skip:0}}
function newGame(){return{version:3,id:'mono-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),players:[makePlayer(saved.nick||'Игрок',0),makePlayer(botNames[0],1),makePlayer(botNames[1],2),makePlayer(botNames[2],3)],board:cloneBoard(),turn:0,phase:'ready',dice:[1,1],message:'Бросай кубики. Покупай с запасом на следующую аренду.',log:['Партия началась. У каждого — 1 500 единиц игрового капитала.'],journal:[{turn:1,text:'Партия началась. У каждого — 1 500 единиц игрового капитала.'}],over:false,winner:null,winners:[],settled:false,turnNumber:1,maxTurns:80,bank:0,paused:false,pace:'calm',diff:saved.monopolyDiff||'normal',pendingSteps:0,lastIndex:0,ledger:[],lastPath:[],lastFrom:0,lastTo:0,lastMover:0,lastSteps:0,lastRelocated:false,lastRoll:null,lastChance:null,lastPayment:null}}
function startGame(){if(!writable()||!initialized)return;if(game&&!game.over)return;if(game&&game.over&&!game.settled&&!settleGame()){render();return}balance=Number.isFinite(profile().balance)?profile().balance:10000;if(balance<100){render('Для входа нужно 100 тренировочных монет. Ежедневный бонус есть в лобби.');return}var difficulty=game?game.diff:saved.monopolyDiff||'normal',pace=game?game.pace:'calm';if(!profilePatch({balance:balance-100})){render('Профиль не подтвердил вход в партию. Проверь сохранение и повтори — новый стол пока не создан.');return}cancelTimer();game=newGame();game.diff=difficulty;game.pace=pace;selectedIndex=null;detailTab="property";ledgerPlayer=0;save();render()}
function alivePlayers(){return game.players.filter(function(p){return p.alive})}
function nextAlive(from){for(var k=1;k<=game.players.length;k++){var i=(from+k)%game.players.length;if(game.players[i].alive)return i}return null}
function netWorth(p){return p.money+p.properties.reduce(function(sum,i){return sum+game.board[i].price},0)}
function addMoney(p,n,reason){p.money+=n;game.bank-=n;cashEntry(p,n,reason||'Продажа участка банку');if(reason)log(p.name+': +'+fmt(n)+' · '+reason)}
function bankrupt(p,creditor){if(!p.alive)return;p.alive=false;var nextOwner=creditor&&creditor.alive?creditor.id:null;game.board.forEach(function(c,i){if(c.owner===p.id){c.owner=nextOwner;if(nextOwner!==null&&!creditor.properties.includes(i))creditor.properties.push(i)}});p.properties=[];log(p.name+' объявляет банкротство.');if(p.id===0)finish(false,'Твоего капитала не хватило на обязательный платёж.');else if(alivePlayers().length<=1)finish(game.players[0].alive,'В городе остался один владелец.')}
function liquidate(p,amount){var sales=[],options=p.properties.slice().sort(function(a,b){return game.board[a].price-game.board[b].price});while(p.money<amount&&options.length){var i=options.shift(),c=game.board[i];var value=Math.floor(c.price/2);c.owner=null;p.properties=p.properties.filter(function(x){return x!==i});p.money+=value;game.bank-=value;cashEntry(p,value,'Продажа «'+c.title+'» банку');sales.push({index:i,value:value});log(p.name+' продаёт «'+c.title+'» банку за '+fmt(value)+'.')}return sales}
function transfer(from,to,amount,reason){if(!from.alive||amount<0||!Number.isFinite(amount))return 0;amount=Math.floor(amount);var moneyBefore=from.money,capitalBefore=netWorth(from),sales=liquidate(from,amount),paid=Math.min(from.money,amount);from.money-=paid;if(to)to.money+=paid;else game.bank+=paid;cashEntry(from,-paid,reason+(to?' · получатель '+to.name:' · в банк'));if(to)cashEntry(to,paid,reason+' · от '+from.name);game.lastPayment={turn:game.turnNumber,player:from.id,creditor:to?to.id:null,reason:reason,amount:amount,paid:paid,moneyBefore:moneyBefore,moneyAfter:from.money,capitalBefore:capitalBefore,capitalAfter:netWorth(from),sales:sales};log(from.name+' платит '+fmt(paid)+(to?' → '+to.name:' в банк')+' · '+reason);if(paid<amount)bankrupt(from,to);return paid}
function rentFor(c){if(c.kind!=='property'||c.owner===null)return 0;var group=game.board.filter(function(x){return x.kind==='property'&&x.color===c.color});var full=group.every(function(x){return x.owner===c.owner});return full?c.rent*2:c.rent}
function purchase(p,idx){var c=game.board[idx];if(!p.alive||!c||c.kind!=='property'||c.owner!==null||p.money<c.price)return false;p.money-=c.price;game.bank+=c.price;cashEntry(p,-c.price,'Покупка «'+c.title+'»');c.owner=p.id;p.properties.push(idx);log(p.name+' покупает «'+c.title+'» за '+fmt(c.price)+'.');return true}
function move(p,steps){if(!Array.isArray(game.lastPath)||game.lastMover!==p.id){game.lastPath=[];game.lastFrom=p.pos;game.lastSteps=0}if(!game.lastPath.length)game.lastFrom=p.pos;game.lastMover=p.id;game.lastSteps=(game.lastSteps||0)+steps;for(var i=0;i<steps;i++){p.pos=(p.pos+1)%game.board.length;game.lastPath.push(p.pos);if(p.pos===0)addMoney(p,200,'прохождение Старта')}game.lastIndex=p.pos;game.lastTo=p.pos}
// Purchase policy uses public ownership, positions, skip status and money only.
// The initial price of a property remains in capital; a purchase is not a capital gain.
function botPurchasePlan(p,c){
  var style=botStyle(p),no=function(reason){return{buy:false,reserve:0,style:style.id,reason:reason}};
  if(!game||game.over||!p||!p.alive||!c||c.kind!=='property'||c.owner!==null||!Number.isFinite(p.money)||p.money<c.price)return no('unavailable');
  var index=game.board.indexOf(c);if(index<0)return no('unavailable');
  var remaining=Math.max(0,game.maxTurns-game.turnNumber);if(!remaining)return no('final-capital');
  var group=game.board.filter(function(x){return x.kind==='property'&&x.color===c.color&&x!==c}),completes=group.length>0&&group.every(function(x){return x.owner===p.id}),rival=group.length?group[0].owner:null;
  var blocks=rival!==null&&rival!==p.id&&game.players[rival]&&game.players[rival].alive&&group.every(function(x){return x.owner===rival}),partial=group.some(function(x){return x.owner===p.id});
  var rentRisk=Math.max.apply(null,[0].concat(game.board.filter(function(x){return x.kind==='property'&&x.owner!==null&&x.owner!==p.id&&game.players[x.owner].alive}).map(rentFor)));

  // Buy only if one of the still-to-move opponents could generate new rent.

    var incomeCells=[index];if(completes)game.board.forEach(function(x,i){if(x.kind==='property'&&x.color===c.color&&x.owner===p.id)incomeCells.push(i)});
    var next=p.id,opportunity=false;
    for(var turn=0;turn<remaining;turn++){next=nextAlive(next);var other=game.players[next];if(!other||other.id===p.id||other.skip)continue;for(var steps=2;steps<=12;steps++){var at=(other.pos+steps)%game.board.length;if(incomeCells.includes(at)||game.board[at].kind==='chance'&&incomeCells.includes((at+2)%game.board.length))opportunity=true}}
    return{buy:opportunity,reserve:0,style:style.id,reason:opportunity?'last-rent':'no-rent-turn',completes:completes,blocks:blocks,rentRisk:rentRisk};
  }
  var easy=game.diff==='easy',hard=game.diff==='hard',base=easy?80:hard?220:180,riskWeight=easy?.5:hard?1.5:1;
  var reserve=Math.max(base+style.bias,Math.ceil(rentRisk*riskWeight)+style.riskPadding),discount=completes?style.completeDiscount:blocks?style.blockDiscount:partial?style.partialDiscount:0;
  if(easy)discount=Math.floor(discount*.55);if(remaining<=8)discount=Math.floor(discount*.5);
  var floor=Math.max(easy?30:hard?110:70,Math.ceil(rentRisk*(easy?.3:hard?.85:.6)));
  reserve=Math.max(floor,reserve-discount);
  return{buy:p.money-c.price>=reserve,reserve:reserve,style:style.id,reason:completes?'complete-group':blocks&&style.blockDiscount?'block-group':'cash-reserve',completes:completes,blocks:blocks,rentRisk:rentRisk};
}
function botWantsProperty(p,c){return botPurchasePlan(p,c).buy}
function chance(p,depth){var e=chances[Math.floor(Math.random()*chances.length)];game.lastChance={text:e.text,delta:e.delta||0,move:e.move||0,player:p.id,turn:game.turnNumber};log(p.name+': шанс — '+e.text+'.');if(e.delta>0)addMoney(p,e.delta,e.text);else if(e.delta<0)transfer(p,null,-e.delta,e.text);else if(e.move){move(p,e.move);land(p,p.pos,depth+1)}}
function land(p,idx,depth){if(!p.alive||game.over)return;depth=depth||0;if(depth>4){log('Цепочка событий завершена.');return}var c=game.board[idx];game.lastIndex=idx;game.phase='review';if(c.kind==='property'){if(c.owner===null){if(p.id===0&&p.money>=c.price){game.phase='buy';log('«'+c.title+'» свободна. Покупка за '+fmt(c.price)+', аренда '+fmt(c.rent)+'.')}else if(p.id!==0&&botWantsProperty(p,c))purchase(p,idx);else log(p.name+' пропускает покупку «'+c.title+'».')}else if(c.owner!==p.id)transfer(p,game.players[c.owner],rentFor(c),'аренда «'+c.title+'»');else log(p.name+' на своей территории — «'+c.title+'».')}else if(c.kind==='tax')transfer(p,null,c.amount,c.title);else if(c.kind==='bonus')addMoney(p,c.amount,'Оазис');else if(c.kind==='chance')chance(p,depth);else if(c.kind==='goto'){p.pos=6;p.skip=1;game.lastIndex=6;game.lastTo=6;game.lastRelocated=true;if(!Array.isArray(game.lastPath))game.lastPath=[];game.lastPath.push(6);log(p.name+' отправляется в Тихий двор и пропустит следующий ход.')}else if(c.kind==='jail')log(p.name+' в Тихом дворе с визитом. Следующий ход обычный.');else log(p.name+' на Старте. Бонус за круг уже начислен.')}
function rollDice(){return[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]}
function roll(){if(!game||!canRun(game)||game.phase!=='ready')return;cancelTimer();var p=game.players[game.turn];selectedIndex=null;game.lastPath=[];game.lastFrom=p.pos;game.lastTo=p.pos;game.lastMover=p.id;game.lastSteps=0;game.lastRelocated=false;game.lastRoll=null;game.lastChance=null;game.lastPayment=null;if(p.skip){p.skip--;game.phase='review';log(p.name+' отдыхает и пропускает этот ход.');save();render();return}game.dice=rollDice();game.lastRoll={turn:game.turnNumber,player:p.id,dice:game.dice.slice()};game.pendingSteps=game.dice[0]+game.dice[1];game.phase='rolling';log(p.name+' бросает '+game.dice[0]+' + '+game.dice[1]+'.');save();render();schedule(resolveRoll,game.pace==='calm'?900:450)}
function resolveRoll(){if(!game||!canRun(game)||game.phase!=='rolling')return;var p=game.players[game.turn];move(p,game.pendingSteps);game.pendingSteps=0;land(p,p.pos,0);save();render()}
function buy(){if(!game||!canRun(game)||game.turn!==0||game.phase!=='buy')return;if(!purchase(game.players[0],game.players[0].pos))log('Покупка недоступна.');game.phase='review';save();render()}
function skipBuy(){if(!game||!canRun(game)||game.turn!==0||game.phase!=='buy')return;game.phase='review';log('Ты оставил свободный участок следующему игроку.');save();render()}
function endTurn(){if(!game||!canRun(game)||game.phase!=='review')return;cancelTimer();if(alivePlayers().length<=1){finish(game.players[0].alive,'Остался один игрок.');return}if(game.turnNumber>=game.maxTurns){finishByCapital();return}game.turn=nextAlive(game.turn);game.turnNumber++;game.phase='ready';selectedIndex=null;game.lastPath=[];game.lastSteps=0;game.lastChance=null;game.lastPayment=null;log(game.turn===0?'Твой ход. Решение за тобой.':game.players[game.turn].name+' готовится к ходу.');save();render();if(game.turn!==0)schedule(roll,game.pace==='calm'?1500:750)}

  var info=actionInfo(),history=window.VEZDEHOT&&typeof window.VEZDEHOT.openHistory==='function',buyPreview=game.phase==='buy'&&!game.paused?purchaseInsight():game.over?'<div class="purchase-preview"><span>'+(game.settled?'Учтено в профиле':'Ожидает начисления')+'<strong>'+(game.winner===0?'+250 V':'Без начисления')+'</strong></span><span>Опыт<strong>+'+(game.winner===0?100:25)+' XP</strong></span></div>':'';
  app.innerHTML=header()+title+saveNotice+(override?'<div class="notice" role="alert">'+esc(override)+'</div>':'')+resultHtml()+turnStrip()+quickActions()+'<div class="layout"><div class="board-column">'+boardHtml()+detailsHtml()+'</div><aside class="sidebar"><section class="panel action-panel '+(game.over?'finished-panel':visual.phase?'phase-enter':'')+'"><div class="action-copy"><div class="action-label"><i class="status-dot" aria-hidden="true"></i>'+(game.over?'ФИНАЛЬНЫЙ БАЛАНС':game.paused?'ИГРА НА ПАУЗЕ':game.phase==='review'?'РЕШЕНИЕ ЗА ТОБОЙ':game.turn===0?'ТВОЯ ОЧЕРЕДЬ':'ХОД СОПЕРНИКА')+'</div><h2 data-action-heading tabindex="-1">'+esc(info[0])+'</h2><p role="status" aria-live="polite">'+esc(info[1])+'</p></div>'+contextTip()+chanceCard()+paymentReceipt()+turnRecap()+buyPreview+'<div class="action-buttons">'+controls()+'</div></section><section class="panel players-panel"><div class="panel-title">Игроки и капитал <span>НАЛИЧНЫЕ / ВСЕГО</span></div><div class="players-list">'+game.players.map(playerHtml).join('')+'</div>'+opponentsHtml()+'</section>'+objectiveHtml()+'<section class="panel log-panel">'+journalHtml()+(history?'<button class="history-button" data-history>Мои партии в Монополии ↗</button>':'')+'</section><label class="settings-row">Темп соперников<select data-pace aria-label="Темп соперников"><option value="calm" '+(game.pace==='calm'?'selected':'')+'>Спокойный</option><option value="normal" '+(game.pace==='normal'?'selected':'')+'>Обычный</option></select></label></aside></div><p class="rules-note">Капитал = наличные + стоимость участков. Если денег на платёж не хватает, банк выкупает участки за половину цены. Все соперники играют по этим же правилам.</p>';
  bind();
  if(showResult){var resultTitle=document.getElementById('mono-result-title');if(resultTitle&&typeof resultTitle.focus==='function')resultTitle.focus()}
  else if(followAction)focusPrimaryAction();
}
function bind(){
  var opponents=document.querySelector('[data-monopoly-opponents]');if(opponents)opponents.ontoggle=function(){opponentsExpanded=opponents.open};
  var journal=document.querySelector('[data-monopoly-journal] details');if(journal)journal.ontoggle=function(){journalExpanded=journal.open};
  if(window.VEZDEHOT&&typeof window.VEZDEHOT.bindSaveNotice==='function')window.VEZDEHOT.bindSaveNotice(document.getElementById('app'),'monopoly',sessionScope());
  var handlers={'data-settle':function(){settleGame();render()},'data-start':startGame,'data-replay':startGame,'data-roll':roll,'data-buy':buy,'data-skip':skipBuy,'data-next':endTurn,'data-pause':togglePause,'data-new':function(){if(!writable()||game&&(!game.over||!game.settled&&!settleGame()))return;cancelTimer();if(game)saved.monopolyDiff=game.diff;game=null;selectedIndex=null;detailTab='property';save();render()},'data-rules':showRules,'data-account':function(){if(window.VEZDEHOT&&window.VEZDEHOT.openAccount){if(game&&!game.over&&!game.paused)togglePause();window.VEZDEHOT.openAccount()}},'data-return-token':function(){selectedIndex=null;detailTab='property';render()},'data-history':function(){if(window.VEZDEHOT&&window.VEZDEHOT.openHistory){if(game&&!game.over&&!game.paused)togglePause();window.VEZDEHOT.openHistory({game:'monopoly'})}}};
  Object.keys(handlers).forEach(function(attr){document.querySelectorAll('['+attr+']').forEach(function(el){el.onclick=function(event){if(writable())handlers[attr](event)}})});
  document.querySelectorAll('[data-cell]').forEach(function(el){el.onclick=function(){if(!writable())return;selectedIndex=Number(el.dataset.cell);detailTab='property';render();var target=document.querySelector('[data-board-cell="'+selectedIndex+'"]');if(target)target.focus({preventScroll:true})}});
  document.querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){if(!writable())return;detailTab=el.dataset.tab;render();document.querySelector('[data-tab="'+detailTab+'"]').focus({preventScroll:true})};el.onkeydown=function(event){if(!writable())return;var tabs=['property','portfolio','ledger'],index=tabs.indexOf(detailTab);if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();detailTab=event.key==='Home'?'property':event.key==='End'?'ledger':tabs[(index+(event.key==='ArrowRight'?1:2))%3];render();document.querySelector('[data-tab="'+detailTab+'"]').focus({preventScroll:true})}}});
  document.querySelectorAll('[data-ledger-for]').forEach(function(el){el.onclick=function(){if(!writable())return;ledgerPlayer=Number(el.dataset.ledgerFor);render();document.querySelector('[data-ledger-for="'+ledgerPlayer+'"]').focus({preventScroll:true})}});
  var diff=document.querySelector('[data-diff]');if(diff)diff.onchange=function(){if(!writable())return;saved.monopolyDiff=diff.value;try{localStorage.setItem(GAME_KEY+'_difficulty',diff.value)}catch(e){}render();var selected=document.querySelector('[data-diff]');if(selected)selected.focus({preventScroll:true})};
  var pace=document.querySelector('[data-pace]');if(pace)pace.onchange=function(){if(!writable())return;game.pace=pace.value;save();resumeTimers()};
}
function showRules(){
  if(!writable()||!window.VEZDEHOT_GUIDE||!window.VEZDEHOT_GUIDE.open)return;
  cancelTimer();if(game&&!game.over){game.paused=true;save()}render();
  window.VEZDEHOT_GUIDE.open({game:'monopoly',title:'Монополия: разбор ходов',context:guideContext(),trigger:document.querySelector('[data-rules]'),sections:[
    {title:'Ход и участок',text:'Каждый начинает с 1 500 игрового капитала. Брось два кубика, выполни действие клетки и передай ход. За прохождение Старта — 200. Вся цветовая группа у одного владельца удваивает аренду. Дубль не даёт дополнительного хода.'},
    {title:'Тихий двор',text:'Клетка «На отдых» отправляет в Тихий двор с пропуском одного хода. Обычное попадание в Тихий двор — просто визит.'},
    {title:'Когда не хватает денег',text:'Игра продаёт твои участки банку за половину цены, начиная с самых дешёвых, пока не хватит на платёж. Если и после продажи денег мало, оставшиеся деньги получает кредитор и наступает банкротство.'},
    {title:'Как определяется победитель',text:'После 80 ходов сравнивается капитал: наличные плюс первоначальная цена участков. При равенстве лидеры делят победу. До лимита можно победить, оставшись единственным игроком. После своего банкротства партия для тебя заканчивается.'},
    {title:'Монеты профиля и формат',text:'Вход стоит 100 тренировочных V. Победителю начисляется 250 V: возврат входа и 150 сверху. В этой компактной версии нет торгов, аукционов, домов и покупки чужих участков. Учебные примеры не меняют твою партию или баланс. После закрытия обучения игра останется на паузе.'}
  ],lessons:guideLessons()});
}
async function init(){if(window.VEZDEHOT&&window.VEZDEHOT.ready){try{await window.VEZDEHOT.ready}catch(e){return}}if(!writable())return;saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:10000;GAME_KEY+='_'+sessionScope();var loaded=loadGame();game=loaded.state;try{saved.monopolyDiff=localStorage.getItem(GAME_KEY+'_difficulty')||'normal'}catch(e){}initialized=true;if(game&&game.over)settleGame();render(window.VEZDEHOT_GAME_STORE?'':loaded.message)}
function pauseSession(){cancelTimer();if(!initialized||!writable())return;if(game&&!game.over)game.paused=true;save()}
function loseSession(){accountChanging=true;cancelTimer();if(game)game.paused=true;var app=document.getElementById('app');app.inert=true;app.style.pointerEvents='none'}
document.addEventListener('vezdehot:sessionpause',pauseSession);
document.addEventListener('vezdehot:sessionlost',loseSession);
document.addEventListener('vezdehot:accountchange',loseSession);
document.addEventListener('vezdehot:profile',function(){if(accountChanging||!initialized)return;saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:balance;var wallet=document.querySelector('.wallet');if(wallet){wallet.querySelector('span').textContent=fmt(balance)+' V';wallet.setAttribute('aria-label','Открыть профиль, баланс '+fmt(balance)+' монет')}});
window.addEventListener('beforeunload',pauseSession);window.addEventListener('pagehide',pauseSession);document.addEventListener('visibilitychange',function(){if(document.hidden)pauseSession();else if(writable())render()});render();init();
})();
</script></body></html>
