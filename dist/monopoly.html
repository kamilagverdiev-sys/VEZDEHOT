<script>
(function(){'use strict';
var KEY='vezdehot_v2',GAME_KEY='vezdehot_monopoly_v3',saved={},balance=10000,game=null,timer=null,ticket=0,initialized=false,accountChanging=false;
var colors=['#d5ef9f','#a995ee','#78bce0','#efb185'],botNames=['Мира','Кекс','Рэй'];
var boardTemplate=[{kind:'start',title:'Старт'},{kind:'property',title:'Маяк',price:120,rent:22,color:'pink'},{kind:'property',title:'Оранжерея',price:140,rent:26,color:'pink'},{kind:'chance',title:'Шанс'},{kind:'tax',title:'Налог',amount:100},{kind:'property',title:'Космопорт',price:170,rent:32,color:'blue'},{kind:'jail',title:'Тихий двор'},{kind:'property',title:'Станция',price:190,rent:38,color:'blue'},{kind:'property',title:'Сад на крыше',price:210,rent:44,color:'green'},{kind:'chance',title:'Шанс'},{kind:'property',title:'Кинотеатр',price:230,rent:50,color:'green'},{kind:'goto',title:'На отдых'},{kind:'property',title:'Арт-кластер',price:260,rent:58,color:'orange'},{kind:'property',title:'Лофт 404',price:280,rent:64,color:'orange'},{kind:'tax',title:'Суперналог',amount:150},{kind:'property',title:'Панорама',price:310,rent:72,color:'purple'},{kind:'chance',title:'Шанс'},{kind:'property',title:'Неон-сквер',price:340,rent:82,color:'purple'},{kind:'bonus',title:'Оазис',amount:120},{kind:'property',title:'Главный хаб',price:380,rent:96,color:'purple'}];
var chances=[{text:'Кэшбэк за удачный ход',delta:100},{text:'Срочный ремонт',delta:-75},{text:'Поддержка инвестора',delta:140},{text:'Вперёд на две клетки',move:2}];
function fmt(n){return Math.floor(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ')}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function profile(){if(window.VEZDEHOT)return window.VEZDEHOT.getProfile();try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function profilePatch(patch){if(accountChanging)return;if(window.VEZDEHOT)window.VEZDEHOT.updateProfile(patch);else{var latest=profile();Object.assign(latest,patch);localStorage.setItem(KEY,JSON.stringify(latest))}saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:10000}
function save(){if(accountChanging||!initialized)return;try{localStorage.setItem(GAME_KEY,JSON.stringify(game))}catch(e){}}
function cancelTimer(){if(timer!==null)clearTimeout(timer);timer=null;ticket++}
function canRun(g){return !accountChanging&&game===g&&!g.over&&!g.paused&&!document.hidden}
function schedule(fn,delay){cancelTimer();var g=game,epoch=ticket;if(!g||!canRun(g))return;timer=setTimeout(function(){timer=null;if(epoch!==ticket||!canRun(g))return;fn()},delay)}
function log(text){game.message=text;game.log.unshift(text);game.log=game.log.slice(0,12)}
function cloneBoard(){return boardTemplate.map(function(c){return Object.assign({},c,{owner:null})})}
function makePlayer(name,id){return{id:id,name:name,money:1500,pos:0,alive:true,properties:[],skip:0}}
function newGame(){return{version:3,id:'mono-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),players:[makePlayer(saved.nick||'Игрок',0),makePlayer(botNames[0],1),makePlayer(botNames[1],2),makePlayer(botNames[2],3)],board:cloneBoard(),turn:0,phase:'ready',dice:[1,1],message:'Бросай кубики. Покупай с запасом на следующую аренду.',log:['Партия началась. У каждого — 1 500 единиц игрового капитала.'],over:false,winner:null,winners:[],settled:false,turnNumber:1,maxTurns:80,bank:0,paused:false,pace:'calm',diff:saved.monopolyDiff||'normal',pendingSteps:0,lastIndex:0}}
function startGame(){if(accountChanging)return;if(game&&!game.over)return;balance=Number.isFinite(profile().balance)?profile().balance:10000;if(balance<100){render('Для входа нужно 100 тренировочных монет. Ежедневный бонус есть в лобби.');return}cancelTimer();profilePatch({balance:balance-100});game=newGame();save();render()}
function alivePlayers(){return game.players.filter(function(p){return p.alive})}
function nextAlive(from){for(var k=1;k<=game.players.length;k++){var i=(from+k)%game.players.length;if(game.players[i].alive)return i}return null}
function netWorth(p){return p.money+p.properties.reduce(function(sum,i){return sum+game.board[i].price},0)}
function addMoney(p,n,reason){p.money+=n;game.bank-=n;if(reason)log(p.name+': +'+fmt(n)+' · '+reason)}
function bankrupt(p,creditor){if(!p.alive)return;p.alive=false;var nextOwner=creditor&&creditor.alive?creditor.id:null;game.board.forEach(function(c,i){if(c.owner===p.id){c.owner=nextOwner;if(nextOwner!==null&&!creditor.properties.includes(i))creditor.properties.push(i)}});p.properties=[];log(p.name+' объявляет банкротство.');if(p.id===0)finish(false,'Твоего капитала не хватило на обязательный платёж.');else if(alivePlayers().length<=1)finish(game.players[0].alive,'В городе остался один владелец.')}
function liquidate(p,amount){var options=p.properties.slice().sort(function(a,b){return game.board[a].price-game.board[b].price});while(p.money<amount&&options.length){var i=options.shift(),c=game.board[i];var value=Math.floor(c.price/2);c.owner=null;p.properties=p.properties.filter(function(x){return x!==i});addMoney(p,value);log(p.name+' продаёт «'+c.title+'» банку за '+fmt(value)+'.')}}
function transfer(from,to,amount,reason){if(!from.alive||amount<0||!Number.isFinite(amount))return 0;amount=Math.floor(amount);liquidate(from,amount);var paid=Math.min(from.money,amount);from.money-=paid;if(to)to.money+=paid;else game.bank+=paid;log(from.name+' платит '+fmt(paid)+(to?' → '+to.name:' в банк')+' · '+reason);if(paid<amount)bankrupt(from,to);return paid}
function rentFor(c){if(c.kind!=='property'||c.owner===null)return 0;var group=game.board.filter(function(x){return x.kind==='property'&&x.color===c.color});var full=group.every(function(x){return x.owner===c.owner});return full?c.rent*2:c.rent}
function purchase(p,idx){var c=game.board[idx];if(!p.alive||!c||c.kind!=='property'||c.owner!==null||p.money<c.price)return false;p.money-=c.price;game.bank+=c.price;c.owner=p.id;p.properties.push(idx);log(p.name+' покупает «'+c.title+'» за '+fmt(c.price)+'.');return true}
function move(p,steps){for(var i=0;i<steps;i++){p.pos=(p.pos+1)%game.board.length;if(p.pos===0)addMoney(p,200,'прохождение Старта')}game.lastIndex=p.pos}
function botWantsProperty(p,c){var reserve=game.diff==='easy'?80:game.diff==='hard'?Math.max(180,Math.max.apply(null,game.board.map(rentFor))):240;var completes=game.board.filter(function(x){return x.kind==='property'&&x.color===c.color&&x!==c}).every(function(x){return x.owner===p.id});return p.money>=c.price+(completes?80:reserve)}
function chance(p,depth){var e=chances[Math.floor(Math.random()*chances.length)];log(p.name+': шанс — '+e.text+'.');if(e.delta>0)addMoney(p,e.delta,'карта шанса');else if(e.delta<0)transfer(p,null,-e.delta,e.text);else if(e.move){move(p,e.move);land(p,p.pos,depth+1)}}
function land(p,idx,depth){if(!p.alive||game.over)return;depth=depth||0;if(depth>4){log('Цепочка событий завершена.');return}var c=game.board[idx];game.lastIndex=idx;game.phase='review';if(c.kind==='property'){if(c.owner===null){if(p.id===0&&p.money>=c.price){game.phase='buy';log('«'+c.title+'» свободна. Покупка за '+fmt(c.price)+', аренда '+fmt(c.rent)+'.')}else if(p.id!==0&&botWantsProperty(p,c))purchase(p,idx);else log(p.name+' пропускает покупку «'+c.title+'».')}else if(c.owner!==p.id)transfer(p,game.players[c.owner],rentFor(c),'аренда «'+c.title+'»');else log(p.name+' на своей территории — «'+c.title+'».')}else if(c.kind==='tax')transfer(p,null,c.amount,c.title);else if(c.kind==='bonus')addMoney(p,c.amount,'Оазис');else if(c.kind==='chance')chance(p,depth);else if(c.kind==='goto'){p.pos=6;p.skip=1;game.lastIndex=6;log(p.name+' отправляется в Тихий двор и пропустит следующий ход.')}else if(c.kind==='jail')log(p.name+' в Тихом дворе с визитом. Следующий ход обычный.');else log(p.name+' на Старте. Бонус за круг уже начислен.')}
function rollDice(){return[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]}
function roll(){if(!game||!canRun(game)||game.phase!=='ready')return;cancelTimer();var p=game.players[game.turn];if(p.skip){p.skip--;game.phase='review';log(p.name+' отдыхает и пропускает этот ход.');save();render();return}game.dice=rollDice();game.pendingSteps=game.dice[0]+game.dice[1];game.phase='rolling';log(p.name+' бросает '+game.dice[0]+' + '+game.dice[1]+'.');save();render();schedule(resolveRoll,game.pace==='calm'?900:450)}
function resolveRoll(){if(!game||!canRun(game)||game.phase!=='rolling')return;var p=game.players[game.turn];move(p,game.pendingSteps);game.pendingSteps=0;land(p,p.pos,0);save();render()}
function buy(){if(!game||!canRun(game)||game.turn!==0||game.phase!=='buy')return;if(!purchase(game.players[0],game.players[0].pos))log('Покупка недоступна.');game.phase='review';save();render()}
function skipBuy(){if(!game||!canRun(game)||game.turn!==0||game.phase!=='buy')return;game.phase='review';log('Ты оставил свободный участок следующему игроку.');save();render()}
function endTurn(){if(!game||!canRun(game)||game.phase!=='review')return;cancelTimer();if(alivePlayers().length<=1){finish(game.players[0].alive,'Остался один игрок.');return}if(game.turnNumber>=game.maxTurns){finishByCapital();return}game.turn=nextAlive(game.turn);game.turnNumber++;game.phase='ready';log(game.turn===0?'Твой ход. Решение за тобой.':game.players[game.turn].name+' готовится к ходу.');save();render();if(game.turn!==0)schedule(roll,game.pace==='calm'?1500:750)}
function finishByCapital(){var alive=alivePlayers(),max=Math.max.apply(null,alive.map(netWorth)),winners=alive.filter(function(p){return netWorth(p)===max}).map(function(p){return p.id});game.winners=winners;finish(winners.includes(0),'Лимит 80 ходов: победил максимальный капитал (деньги + цена собственности).')}
function settleGame(){if(accountChanging||!game||!game.over||game.settled)return;var won=game.winner===0;save();if(window.VEZDEHOT){window.VEZDEHOT.recordResult({game:'monopoly',win:won,delta:won?250:0,xp:won?100:25,id:game.id})}else{var current=profile();profilePatch({balance:(Number.isFinite(current.balance)?current.balance:10000)+(won?250:0),wins:(current.wins||0)+(won?1:0),games:(current.games||0)+1,xp:(current.xp||0)+(won?100:25)})}game.settled=true;saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:balance;save()}
function finish(won,reason){if(!game||game.over)return;cancelTimer();game.over=true;game.phase='over';game.winner=won?0:null;game.resultReason=reason;game.message=won?'Ты выиграл городскую партию.':'Партия завершена.';settleGame();render()}
function togglePause(){if(accountChanging||!game||game.over)return;cancelTimer();game.paused=!game.paused;save();render();if(!game.paused)resumeTimers()}
function resumeTimers(){if(!game||!canRun(game))return;if(game.phase==='rolling')schedule(resolveRoll,650);else if(game.phase==='ready'&&game.turn!==0)schedule(roll,game.pace==='calm'?1500:750)}
function restore(value){if(!value||value.version!==3||!Array.isArray(value.players)||value.players.length!==4||!Array.isArray(value.board)||value.board.length!==20)return null;value.paused=!value.over;return value}
// Engine ends here. UI is intentionally separate from transaction and turn rules.
function cellPosition(i){if(i<=5)return[6,6-i];if(i<=10)return[11-i,1];if(i<=15)return[1,i-9];return[i-14,6]}
function cellHtml(c,i){var pos=cellPosition(i),palette={pink:'#c98caa',blue:'#81abc9',green:'#8ab9a4',orange:'#c6a079',purple:'#a79bc9'},active=game.players[game.turn].pos===i&&!game.over,owner=c.owner===null?null:game.players[c.owner],tokens=game.players.filter(function(p){return p.alive&&p.pos===i}).map(function(p){return '<span class="token" style="--token:'+colors[p.id]+'" title="'+esc(p.name)+'">'+(p.id+1)+'</span>'}).join('');return '<div class="cell '+(active?'active':'')+'" style="grid-row:'+pos[0]+';grid-column:'+pos[1]+';--stripe:'+(palette[c.color]||'#59637a')+'" title="'+esc(c.title)+(owner?' · '+esc(owner.name):'')+'"><span class="stripe"></span><span class="cell-num">'+(i+1)+'</span>'+(owner?'<i class="owner-mark" style="--token:'+colors[owner.id]+'" aria-label="Владелец '+esc(owner.name)+'"></i>':'')+'<span class="cell-name">'+esc(c.title)+'</span><span class="cell-price">'+(c.price?fmt(c.price):c.kind==='tax'?'−'+c.amount:c.kind==='bonus'?'+'+c.amount:c.kind==='start'?'+200':'◇')+'</span><div class="tokens">'+tokens+'</div></div>'}
function dieHtml(n){var dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};return '<span class="die" aria-label="Кубик: '+n+'">'+Array.from({length:9},function(_,i){return '<i class="'+(dots[n].includes(i)?'on':'')+'"></i>'}).join('')+'</span>'}
function playerHtml(p){return '<div class="player '+(game.turn===p.id&&!game.over?'active ':'')+(!p.alive?'out':'')+'"><span class="player-token" style="--token:'+colors[p.id]+'">'+(p.id+1)+'</span><div><b>'+esc(p.name)+(p.id===0?' · ты':'')+'</b><small>'+(!p.alive?'Банкрот':p.properties.length+' объектов'+(p.skip?' · отдыхает':''))+'</small></div><div class="player-money">'+fmt(p.money)+'<small>капитал '+fmt(netWorth(p))+'</small></div></div>'}
function actionInfo(){if(game.over)return[game.winner===0?'Победа':'Партия окончена',game.resultReason];if(game.paused)return['Пауза','Партия сохранена. Боты ждут, пока ты вернёшься.'];if(game.phase==='buy')return['Забрать участок?',game.message];if(game.phase==='rolling')return['Бросок кубиков',game.message];if(game.phase==='review')return['Результат хода',game.message];return[game.turn===0?'Твой ход':game.players[game.turn].name+' думает',game.message]}
function controls(){if(game.over)return '<button class="btn primary" data-new>Новая партия</button><a class="btn subtle" href="./index.html">Лобби</a>';if(game.paused)return '<button class="btn primary" data-pause>Продолжить партию</button>';if(game.phase==='rolling')return '<button class="btn" disabled>Кубики в движении</button>';if(game.phase==='buy')return '<button class="btn primary" data-buy>Купить за '+game.board[game.players[0].pos].price+'</button><button class="btn" data-skip>Пропустить</button>';if(game.phase==='review')return '<button class="btn primary" data-next>Продолжить →</button>';if(game.turn===0)return '<button class="btn primary" data-roll>'+(game.players[0].skip?'Пропустить отдых':'Бросить кубики')+'</button>';return '<button class="btn" disabled>Соперник готовится</button>'}
function header(){return '<header class="mono-top"><a class="icon-button" href="./index.html" aria-label="Вернуться в лобби">‹</a><a class="brand" href="./index.html">VEZDEHOT<small>ГОРОДСКАЯ СТРАТЕГИЯ</small></a><span class="top-spacer"></span><span class="wallet">'+fmt(balance)+' V</span><button class="icon-button" data-rules aria-label="Правила Монополии">?</button>'+(game&&!game.over?'<button class="icon-button" data-pause aria-label="'+(game.paused?'Продолжить':'Пауза')+'">'+(game.paused?'▶':'Ⅱ')+'</button>':'')+'</header>'}
function render(override){var app=document.getElementById('app');if(!initialized){app.innerHTML='<div class="notice">Подготавливаем игровой стол…</div>';return}var title='<div class="heading"><div><div class="eyebrow">20 клеток · 4 игрока · соло</div><h1>Монополия</h1><p>Город растёт. Кто станет его главным владельцем?</p></div>'+(game?'<div class="round-count">ХОД<b>'+game.turnNumber+' / '+game.maxTurns+'</b></div>':'')+'</div>';if(!game){app.innerHTML=header()+title+(override?'<div class="notice">'+esc(override)+'</div>':'')+'<section class="panel intro"><div><h2>Построй свою<br>городскую империю.</h2><p>Покупай кварталы, собирай цветовые группы и оставляй запас на аренду. Каждый ход можно спокойно рассмотреть.</p><div class="features"><div class="feature"><i>01</i><div><b>Капитал на старте — 1 500</b><small>Игровой капитал отдельно от монет профиля.</small></div></div><div class="feature"><i>02</i><div><b>Собери цветовую группу</b><small>Полная группа приносит двойную аренду.</small></div></div><div class="feature"><i>03</i><div><b>Банкротство или 80 ходов</b><small>На лимите побеждает самый большой капитал.</small></div></div></div><label class="intro-config">Боты <select data-diff><option value="easy" '+(saved.monopolyDiff==='easy'?'selected':'')+'>Лёгкие</option><option value="normal" '+(!saved.monopolyDiff||saved.monopolyDiff==='normal'?'selected':'')+'>Обычные</option><option value="hard" '+(saved.monopolyDiff==='hard'?'selected':'')+'>Осторожные</option></select></label></div><div class="intro-art"><div class="buildings" aria-hidden="true"><i></i><i></i><i></i></div><button class="btn primary" data-start>Начать партию · 100 V</button><small>Победа: возврат входа и +150 V</small></div></section><p class="rules-note">Компактный вариант: без торгов, аукционов, домов и дополнительных ходов за дубль. Монеты тренировочные. Партию можно прервать и продолжить на этом устройстве.</p>';bind();return}var at=game.board[game.players[game.turn].pos],owner=at.owner===null?null:game.players[at.owner],info=actionInfo();app.innerHTML=header()+title+'<div class="layout"><section class="board-shell"><div class="board">'+game.board.map(cellHtml).join('')+'<div class="board-center '+(game.phase==='rolling'&&!game.paused?'rolling':'')+'"><span class="center-label">ТВОЙ ГОРОД · ТВОИ РЕШЕНИЯ</span><div class="center-brand">VEZDEHOT</div><div class="dice-row">'+game.dice.map(dieHtml).join('')+'</div><div class="center-land">'+esc(at.title)+'</div><div class="center-sub">'+(owner?'Владелец: '+esc(owner.name):at.kind==='property'?'Участок свободен':'Клетка '+(game.players[game.turn].pos+1)+' из 20')+'</div>'+(at.kind==='property'?'<div class="center-property"><span>Стоимость<b>'+fmt(at.price)+'</b></span><span>Аренда<b>'+fmt(at.owner===null?at.rent:rentFor(at))+'</b></span></div>':'')+'</div></div><div class="board-footer"><span>Фишки движутся по периметру ↻</span><span>Полная группа: аренда ×2</span></div></section><aside class="sidebar"><section class="panel action-panel"><div class="action-label">'+(game.paused?'ПАРТИЯ СОХРАНЕНА':game.phase==='review'?'БЕЗ СПЕШКИ':game.turn===0?'ТВОЁ РЕШЕНИЕ':'ХОД СОПЕРНИКА')+'</div><h2>'+esc(info[0])+'</h2><p role="status" aria-live="polite">'+esc(info[1])+'</p><div class="action-buttons">'+controls()+'</div></section><section class="panel players-panel"><div class="panel-title">Игроки и капитал</div>'+game.players.map(playerHtml).join('')+'</section><section class="panel log-panel"><div class="panel-title">Последние события</div><div class="log-list">'+game.log.map(function(s){return '<div class="log-entry">'+esc(s)+'</div>'}).join('')+'</div></section><div class="settings-row"><span>Темп ботов</span><select data-pace aria-label="Темп ботов"><option value="calm" '+(game.pace==='calm'?'selected':'')+'>Спокойный</option><option value="normal" '+(game.pace==='normal'?'selected':'')+'>Обычный</option></select></div></aside></div><p class="rules-note">Капитал = наличные + стоимость участков. При нехватке денег банк автоматически выкупает участки за половину цены. Боты играют по тем же правилам.</p>';bind()}
function bind(){var handlers={'data-start':startGame,'data-roll':roll,'data-buy':buy,'data-skip':skipBuy,'data-next':endTurn,'data-pause':togglePause,'data-new':function(){cancelTimer();game=null;save();render()},'data-rules':showRules};Object.keys(handlers).forEach(function(attr){document.querySelectorAll('['+attr+']').forEach(function(el){el.onclick=function(event){if(!accountChanging)handlers[attr](event)}})});var diff=document.querySelector('[data-diff]');if(diff)diff.onchange=function(){if(accountChanging)return;saved.monopolyDiff=diff.value;try{localStorage.setItem(GAME_KEY+'_difficulty',diff.value)}catch(e){}};var pace=document.querySelector('[data-pace]');if(pace)pace.onchange=function(){if(accountChanging)return;game.pace=pace.value;save();resumeTimers()}}
function showRules(){var wasPaused=game&&game.paused;cancelTimer();if(game&&!game.over)game.paused=true;var modal=document.createElement('div');modal.className='modal-shade';modal.innerHTML='<section class="rules-dialog" role="dialog" aria-modal="true" aria-label="Правила городской Монополии"><h2>Городская Монополия</h2><p>Каждый начинает с 1 500 игрового капитала. Бросай два кубика, покупай свободные участки и собирай аренду с соперников. За прохождение Старта — 200.</p><p>Вся цветовая группа у одного владельца удваивает аренду. Покупать чужие участки и строить дома здесь нельзя. Аукционов и дополнительных ходов за дубль нет.</p><p>Клетка «На отдых» отправляет в Тихий двор с пропуском одного хода. Обычное попадание в Тихий двор — просто визит.</p><p>Если денег на платёж не хватает, участки автоматически продаются банку за половину цены. Остаток денег получает кредитор. Когда не хватает и этого — банкротство.</p><p>После 80 ходов сравнивается капитал: наличные плюс первоначальная цена всех участков. При равенстве лидеры делят победу. До лимита можно выиграть, оставшись единственным игроком. После своего банкротства партия для тебя заканчивается.</p><p>Вход — 100 тренировочных монет профиля. Победителю начисляется 250: возврат входа и 150 сверху. Игра сохраняется на этом устройстве.</p><button class="btn primary" data-close>Вернуться к игре</button></section>';document.body.appendChild(modal);var close=function(){modal.remove();if(game&&!game.over){game.paused=wasPaused;save();render();resumeTimers()}};modal.querySelector('[data-close]').onclick=close;modal.onkeydown=function(e){if(e.key==='Escape')close()};modal.querySelector('[data-close]').focus()}
async function init(){if(window.VEZDEHOT&&window.VEZDEHOT.ready){try{await window.VEZDEHOT.ready}catch(e){}}saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:10000;GAME_KEY+='_'+(window.VEZDEHOT?window.VEZDEHOT.scopeKey():'guest');try{game=restore(JSON.parse(localStorage.getItem(GAME_KEY)||'null'))}catch(e){game=null}try{saved.monopolyDiff=localStorage.getItem(GAME_KEY+'_difficulty')||'normal'}catch(e){}initialized=true;if(game&&game.over)settleGame();render()}
document.addEventListener('vezdehot:accountchange',function(){accountChanging=true;cancelTimer();if(game)game.paused=true;var app=document.getElementById('app');app.inert=true;app.style.pointerEvents='none'});
document.addEventListener('vezdehot:profile',function(){if(accountChanging||!initialized)return;saved=profile();balance=Number.isFinite(saved.balance)?saved.balance:balance;var wallet=document.querySelector('.wallet');if(wallet)wallet.textContent=fmt(balance)+' V'});
window.addEventListener('beforeunload',function(){cancelTimer();save()});document.addEventListener('visibilitychange',function(){if(document.hidden){cancelTimer();if(game&&!game.over){game.paused=true;save()}}else render()});render();init();
})();
</script></body></html>
