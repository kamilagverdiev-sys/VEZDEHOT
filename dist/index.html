    function bindLobby(){$('[data-play]').onclick=()=>{s.view='room';s.room={code:code(),bots:2,diff:'normal',stake:0,mode:'durak'};save();render()};$('[data-bunker]').onclick=()=>{s.view='room';s.room={code:code(),bots:5,diff:'normal',stake:100,mode:'bunker'};save();render()};$('[data-create]').onclick=()=>{s.view='room';s.room={code:code(),bots:2,diff:'normal',stake:0,mode:'durak'};save();render()};const b=$('[data-bonus]');if(b&& !b.disabled)b.onclick=()=>{s.balance+=1000;s.bonusAt=Date.now();save();toast('+1 000 монет','good');render()};$('[data-join]').onclick=()=>{const c=$('[data-join-code]').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==6)return toast('Код должен содержать 6 символов','bad');s.view='room';s.room={code:c,bots:2,diff:'normal',stake:0};save();render()}}
    function room(){const r=s.room||{code:code(),bots:2,diff:'normal',stake:0,mode:'durak'};if(r.mode==='bunker')return bunkerRoom(r);return `<main class="app view"><div class="room-wrap">${top('Комната','‹ Лобби')}<section class="room-title"><div class="eyebrow">Локальная комната</div><h1 class="gradient">Комната</h1><p>Подготовь стол и начинай игру</p><div class="room-code">${r.code}</div></section><section class="panel room-panel"><div class="label">Игроки за столом</div><div class="members"><div class="member"><div class="face">🙂</div><b>${esc(s.nick)}</b><small>ты · ведущий</small></div>${Array.from({length:r.bots},(_,i)=>`<div class="member"><div class="face">${avatars[i]}</div><b>${botNames[i]}</b><small>бот · ${r.diff==='easy'?'легко':r.diff==='hard'?'сложно':'нормально'}</small></div>`).join('')}</div></section><section class="panel room-panel"><div class="label">Количество ботов</div><div class="seg" data-bot-count>${[1,2,3].map(n=>`<button data-bots="${n}" class="${r.bots===n?'on':''}">${n} ${n===1?'бот':'бота'}</button>`).join('')}</div><div style="height:14px"></div><div class="label">Уровень ботов</div><div class="seg" data-diff>${[['easy','Легко'],['normal','Нормально'],['hard','Сложно']].map(([v,l])=>`<button data-diff-value="${v}" class="${r.diff===v?'on':''}">${l}</button>`).join('')}</div><div style="height:14px"></div><div class="label">Ставка на партию</div><div class="seg" data-stake>${[0,100,500,1000].map(v=>`<button data-stake-value="${v}" class="${r.stake===v?'on':''}">${v?fmt(v)+' 🪙':'На интерес'}</button>`).join('')}</div></section><div class="room-note">💡 Боты используют тот же игровой движок, что и игрок. На сложном уровне они выбирают более сильные карты и реже ошибаются.</div><div class="room-actions" style="margin-top:12px"><button class="btn" data-copy>📋 Скопировать код</button><button class="btn primary grow" data-start>Начать партию</button></div></div></main>`}
    function bindRoom(){const r=s.room;$$('[data-bots]').forEach(b=>b.onclick=()=>{r.bots=+b.dataset.bots;save();render()});$$('[data-diff-value]').forEach(b=>b.onclick=()=>{r.diff=b.dataset.diffValue;save();render()});$$('[data-stake-value]').forEach(b=>b.onclick=()=>{r.stake=+b.dataset.stakeValue;save();render()});$('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(r.code);toast('Код скопирован','good')}catch{toast('Код комнаты: '+r.code)}};$('[data-start]').onclick=()=>{if(r.mode==='bunker'){if(s.balance<100)return toast('Для Бункера нужна ставка 100 монет','bad');startBunker(r);return}if(r.stake&&s.balance<r.stake)return toast('Недостаточно монет','bad');startGame(r)}}
    function deck(){const d=[];for(const [suit,color] of suits)for(const rank of ranks)d.push({rank,suit,color,id:rank+suit});return d}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function startGame(r){if(r.stake)s.balance-=r.stake;s.game={...newGame(r),reserved:r.stake};s.view='game';save();render();advance()}
    function newGame(r){const d=shuffle(deck()), players=[{name:s.nick,face:'🙂',kind:'human',hand:[]},...Array.from({length:r.bots},(_,i)=>({name:botNames[i],face:avatars[i],kind:'bot',hand:[]}))];players.forEach(p=>{for(let i=0;i<6;i++)p.hand.push(d.pop())});return{players,deck:d,trump:d[d.length-1].suit,attacker:0,defender:1,phase:'attack',table:[],roundLimit:null,selected:null,message:'Твой ход: выбери карту для атаки',diff:r.diff,stake:r.stake,round:1,over:false,winner:null,lastCard:null,lastPair:null}}
    function isTrump(c,g){return c.suit===g.trump}function beats(def,atk,g){if(def.suit===atk.suit)return ranks.indexOf(def.rank)>ranks.indexOf(atk.rank);return isTrump(def,g)&&!isTrump(atk,g)}function sortHand(h,g){h.sort((a,b)=>(isTrump(a,g)?1:0)-(isTrump(b,g)?1:0)||ranks.indexOf(a.rank)-ranks.indexOf(b.rank))}
    function drawUp(i,g){while(g.players[i].hand.length<6&&g.deck.length)g.players[i].hand.push(g.deck.pop());sortHand(g.players[i].hand,g)}
    function botCard(i,g){const h=g.players[i].hand;return h.slice().sort((a,b)=>ranks.indexOf(a.rank)-ranks.indexOf(b.rank))[0]}
    function canAddAttack(c,g){if(!c||!g.table.length)return true;return g.table.some(pair=>c.rank===pair.a.rank||(pair.d&&c.rank===pair.d.rank))}
    function chooseDefense(i,g){const pair=g.table[g.table.length-1],atk=pair.a,h=g.players[i].hand.filter(c=>beats(c,atk,g));if(!h.length)return null;const sorted=h.sort((a,b)=>(isTrump(a,g)?1:0)-(isTrump(b,g))||ranks.indexOf(a.rank)-ranks.indexOf(b.rank));return sorted[0]}
    function showResolve(g,took=false){if(!g.table.length)return;if(took){const hand=g.players[g.defender].hand;g.table.forEach(pair=>{hand.push(pair.a);if(pair.d)hand.push(pair.d)});}g.resolve={took,prepared:took};g.phase='resolve';g.message=took?`${g.players[g.defender].name} забирает карты · проверь стол и продолжи`:'Отбито! Можно добавить карту того же достоинства или завершить атаку';save();render()}
    function continueRound(){const g=s.game;if(!g||g.over||g.phase!=='resolve')return;const took=!!g.resolve?.took;if(took)return endRound(g,true);g.resolve=null;if(g.table.length>=(g.roundLimit||6)){return endRound(g,false)}g.phase='attack';g.selected=null;g.message=g.attacker===0?'Отбивка есть. Добавь карту того же достоинства или заверши атаку':'Отбивка есть. Бот решает, продолжать ли атаку…';save();render();advance()}
    function finishAttack(){const g=s.game;if(!g||g.over||g.phase!=='attack'||g.attacker!==0||!g.table.length)return;endRound(g,false)}
    function endRound(g,took=false){const a=g.attacker,d=g.defender,pairs=g.table;if(!pairs.length)return;if(took&&!g.resolve?.prepared){g.players[d].hand.push(...pairs.flatMap(pair=>pair.d?[pair.a,pair.d]:[pair.a]));}const pair=pairs[pairs.length-1];g.message=took?'Карты забраны. Атакующий сохраняет ход':'Отбито! Защищавшийся становится атакующим';g.lastCard=pair.d||pair.a;g.lastPair={a:pair.a,d:pair.d||null,took};g.table=[];g.resolve=null;g.roundLimit=null;drawUp(a,g);drawUp(d,g);for(const p of g.players)if(!p.hand.length&&!g.deck.length){g.over=true;g.winner=p===g.players[0]?0:g.players.indexOf(p);g.message=g.winner===0?'Ты выиграл партию!':'Победил '+p.name;settle(g);return}g.attacker=took?a:d;g.defender=(g.attacker+1)%g.players.length;g.phase='attack';g.selected=null;g.round++;save();render();advance()}
    function settle(g){s.games++;if(g.winner===0){s.wins++;const prize=g.stake?g.stake*(g.players.length):0;s.balance+=g.stake+prize;s.xp+=80;g.message=`Победа! +${fmt(prize)} 🪙`;}else{s.xp+=25}save();render()}
    function playAttack(){const g=s.game;if(g.over||g.phase!=='attack'||g.attacker!==0||g.selected===null)return;const p=g.players[0],c=p.hand[g.selected];if(!canAddAttack(c,g))return toast('Добавь карту того же достоинства, что уже лежит на столе','bad');if(!g.table.length)g.roundLimit=Math.min(6,g.players[g.defender].hand.length);p.hand.splice(g.selected,1);g.table.push({a:c,d:null});g.lastPair=null;g.selected=null;g.phase='defend';g.message=`${g.players[g.defender].name} думает над ответом…`;save();render();setTimeout(()=>botDefend(),1650)}
    function humanDefend(){const g=s.game;if(g.over||g.phase!=='defend'||g.defender!==0||g.selected===null)return;const p=g.players[0],pair=g.table[g.table.length-1],c=p.hand[g.selected];if(!beats(c,pair.a,g))return toast('Этой картой нельзя побить','bad');p.hand.splice(g.selected,1);pair.d=c;g.selected=null;showResolve(g,false)}
    function humanTake(){const g=s.game;if(g.over||g.phase!=='defend'||g.defender!==0)return;showResolve(g,true)}
    function botDefend(){const g=s.game;if(g.over||g.phase!=='defend')return;const i=g.defender,c=chooseDefense(i,g);if(c){g.players[i].hand.splice(g.players[i].hand.indexOf(c),1);g.table[g.table.length-1].d=c;showResolve(g,false)}else{showResolve(g,true)}}
    function botAttack(){const g=s.game;if(g.over||g.phase!=='attack')return;const i=g.attacker,p=g.players[i];if(g.table.length){const options=p.hand.filter(c=>canAddAttack(c,g));if(!options.length||g.table.length>=(g.roundLimit||6)||Math.random()<.45){g.message=p.name+' завершает атаку';save();render();setTimeout(()=>endRound(g,false),1250);return}const c=options.sort((a,b)=>ranks.indexOf(a.rank)-ranks.indexOf(b.rank))[0];p.hand.splice(p.hand.indexOf(c),1);g.table.push({a:c,d:null})}else{const c=botCard(i,g);g.roundLimit=Math.min(6,g.players[g.defender].hand.length);p.hand.splice(p.hand.indexOf(c),1);g.table=[{a:c,d:null}];g.lastPair=null}g.phase='defend';g.message=g.defender===0?'На тебя напали: выбери карту или забери её':`${g.players[g.defender].name} думает над ответом…`;save();render();if(g.defender===0)return;setTimeout(()=>botDefend(),1650)}
    function advance(){const g=s.game;if(!g||g.over)return;if(g.phase==='attack'){if(g.attacker===0){g.message='Твой ход: выбери карту для атаки';render()}else setTimeout(()=>botAttack(),1650)}else if(g.phase==='defend'){if(g.defender===0){g.message='Тебе нужно отбиться или забрать карту';render()}else setTimeout(()=>botDefend(),1650)}}
    function bunkerRoom(r){return `<main class="app view"><div class="room-wrap">${top('Комната','‹ Лобби')}<section class="room-title"><div class="eyebrow">Бункер · локальная комната</div><h1 class="gradient">Бункер</h1><p>6 игроков, 3 места в убежище</p><div class="room-code">${r.code}</div></section><section class="panel room-panel"><div class="label">Игроки за столом</div><div class="members"><div class="member"><div class="face">🙂</div><b>${esc(s.nick)}</b><small>ты · кандидат</small></div>${Array.from({length:5},(_,i)=>`<div class="member"><div class="face">${avatars[i]}</div><b>${botNames[i]}</b><small>бот · ${r.diff==='easy'?'легко':r.diff==='hard'?'сложно':'нормально'}</small></div>`).join('')}</div></section><section class="panel room-panel"><div class="row"><span class="coin">U</span><div><b>Ставка 100 монет</b><small style="display:block;color:var(--muted)">Если выживешь: возврат ставки +150 чистыми</small></div></div><div style="height:12px"></div><div class="label">Уровень ошибок ботов</div><div class="seg">${[['easy','Легко'],['normal','Нормально'],['hard','Сложно']].map(([v,l])=>`<button data-diff-value="${v}" class="${r.diff===v?'on':''}">${l}</button>`).join('')}</div></section><div class="room-note">🟢 Каждый раунд ты открываешь одну карту. После этого все голосуют, кого не брать в бункер. Игра заканчивается, когда останутся три человека.</div><div class="room-actions" style="margin-top:12px"><button class="btn" data-copy>📋 Скопировать код</button><button class="btn primary grow" data-start>Начать Бункер</button></div></div></main>`}
    const bunkerTypes=[['profession','💼','Профессия'],['health','❤️','Здоровье'],['hobby','🎯','Хобби'],['baggage','🎒','Багаж'],['phobia','😨','Фобия'],['fact','📌','Факт']];
    const bunkerPools={profession:[['Врач скорой помощи',8],['Инженер-гидролог',7],['Учитель химии',6],['Агроном',6],['Повар',5],['Пожарный',8],['Психолог',7],['Механик',5]],health:[['Отличное здоровье',8],['Аллергия на пыльцу',5],['Слабое зрение',4],['Астма под контролем',4],['Перелом руки в прошлом',6],['Сильная выносливость',8],['Диабет, есть инсулин',5],['Мигрени',3]],hobby:[['Радиолюбительство',7],['Выращивание овощей',8],['Туризм и ориентирование',8],['Шахматы',5],['Плавание',6],['Ремонт техники',7],['Кулинария',6],['Коллекционирование марок',3]],baggage:[['Аптечка и антибиотики',9],['Фильтр для воды',9],['Набор инструментов',8],['Пять литров топлива',7],['Тёплые спальники',7],['Только личные вещи',3],['Рация без зарядки',5],['Семена овощей',8]],phobia:[['Высоты',4],['Замкнутого пространства',4],['Насекомых',3],['Громких звуков',3],['Темноты',3],['Нет фобий',7],['Одиночества',4],['Крови',2]],fact:[['Знает три языка',8],['Имеет опыт выживания в лесу',9],['Не умеет плавать',2],['Лидер волонтёрского отряда',8],['Боится ответственности',3],['Может чинить генераторы',9],['Никогда не жил за городом',4],['Секрет: бывший спасатель',8]]};
    const bunkerPick=(type)=>{const a=bunkerPools[type],x=a[Math.floor(Math.random()*a.length)];return {title:x[0],score:x[1]}};
    function makeBunkerPlayer(name,face,kind){return {name,face,kind,alive:true,cards:bunkerTypes.map(([type,icon,label])=>({type,icon,label,...bunkerPick(type),revealed:false}))};}
    function startBunker(r){if(s.balance<100)return toast('Для Бункера нужна ставка 100 монет','bad');s.balance-=100;s.game={players:[makeBunkerPlayer(s.nick,'🙂','human'),...Array.from({length:5},(_,i)=>makeBunkerPlayer(botNames[i],avatars[i],'bot'))],round:1,phase:'reveal',diff:r.diff,stake:100,selectedCard:null,votes:null,eliminated:[],message:'Открой одну свою карту — она подсвечена зелёным',over:false,result:null};s.view='bunker';save();render();}
    function bunkerScore(p){return p.cards.filter(c=>c.revealed).reduce((n,c)=>n+c.score,0)+(p.cards.filter(c=>c.revealed).length===0?0:1);}
    function bunkerRevealBots(g){g.players.filter(p=>p.kind==='bot'&&p.alive).forEach(p=>{const hidden=p.cards.filter(c=>!c.revealed);if(hidden.length){hidden[Math.floor(Math.random()*hidden.length)].revealed=true}});}
    function bunkerHumanReveal(i){const g=s.game;if(!g||g.over||g.phase!=='reveal')return;const p=g.players[0],c=p.cards[i];if(!c||c.revealed)return; c.revealed=true;g.selectedCard=null;bunkerRevealBots(g);g.phase='vote';g.message='Выбери игрока, которого не берёте в бункер';save();render();}
    function bunkerBotVote(bot,g){const candidates=g.players.filter((p,i)=>p.alive&&i!==g.players.indexOf(bot));if(!candidates.length)return 0;let target=candidates.slice().sort((a,b)=>bunkerScore(a)-bunkerScore(b))[0];const mistake=g.diff==='easy'?.55:g.diff==='hard'?.08:.25;if(Math.random()<mistake)target=candidates[Math.floor(Math.random()*candidates.length)];return g.players.indexOf(target);}
    function bunkerHumanVote(target){const g=s.game;if(!g||g.over||g.phase!=='vote')return;if(target===0||!g.players[target]||!g.players[target].alive)return;const tally=Array(g.players.length).fill(0);tally[target]++;g.players.forEach((p,i)=>{if(p.kind==='bot'&&p.alive)tally[bunkerBotVote(p,g)]++});const max=Math.max(...tally);const tied=g.players.map((p,i)=>({p,i,v:tally[i]})).filter(x=>x.p.alive&&x.i!==0&&x.v===max);const out=tied[Math.floor(Math.random()*tied.length)]||g.players.map((p,i)=>({p,i,v:tally[i]})).filter(x=>x.p.alive&&x.v===max)[0];g.votes=tally;out.p.alive=false;g.eliminated.push(out.i);g.message=`${out.p.name} покидает бункер · ${max} голосов`;if(!g.players[0].alive){g.over=true;g.result='lost';g.message='Тебя исключили. Партия окончена.';settleBunker(g)}else if(g.players.filter(p=>p.alive).length<=3){g.over=true;g.result='survived';g.message='Ты выжил! В бункере осталось 3 места.';settleBunker(g)}else{g.round++;g.phase='reveal'}save();render();}
    function settleBunker(g){s.games++;if(g.result==='survived'){s.wins++;s.balance+=250;s.xp+=120;g.message='Ты выжил! +150 чистыми 🪙 (ставка возвращена)'}else{s.xp+=25}save();}
    function bunkerCard(c,idx,interactive){if(!c.revealed){if(interactive)return `<button class="bunker-card ready" data-bunker-card="${idx}"><span class="type">${c.icon}</span><span><strong>${c.label}</strong>Открыть карту</span></button>`;return `<div class="bunker-card hidden-card"><span class="type">🔒</span><span><strong>${c.label}</strong>Скрыто</span></div>`}return `<div class="bunker-card revealed"><span class="type">${c.icon}</span><span><strong>${c.label}</strong>${esc(c.title)}</span></div>`}
    function bunkerView(){const g=s.game,alive=g.players.filter(p=>p.alive).length;return `<main class="app view"><div class="bunker-board">${top('Бункер','‹ Комната')}<div class="bunker-head"><div><div class="eyebrow">РАУНД ${g.round} · ${alive} КАНДИДАТОВ</div><h1 class="gradient">Бункер</h1><p>Три места · скрытые характеристики · без чата и судьи</p></div><div class="bunker-status">${g.over?(g.result==='survived'?'ТЫ ВЫЖИЛ':'ТЫ ВЫБЫЛ'):g.phase==='reveal'?'ОТКРОЙ КАРТУ':'ГОЛОСОВАНИЕ'}<br><span style="color:var(--muted)">ставка 100 🪙</span></div></div><div class="bunker-note">${esc(g.message)}</div><div class="bunker-grid">${g.players.map((p,i)=>`<article class="bunker-player ${p.alive?'alive':'out'} ${i===0?'you':''} ${g.phase==='vote'&&p.alive&&i!==0&&!g.over?'vote-target':''}" data-bunker-vote="${i}"><div class="bunker-player-top"><span class="face">${p.face}</span><div><b>${esc(p.name)}${i===0?' · ты':''}</b><small>${p.alive?'в игре':'исключён'} · открыто ${p.cards.filter(c=>c.revealed).length}/6</small></div></div><div class="bunker-cards">${p.cards.map((c,j)=>bunkerCard(c,j,p.kind==='human'&&g.phase==='reveal'&&p.alive)).join('')}</div>${g.votes?`<div class="bunker-votes">${g.votes[i]||0} голос${(g.votes[i]||0)===1?'':'ов'}</div>`:''}</article>`).join('')}</div>${g.over?`<div class="bunker-result"><h2>${g.result==='survived'?'🎉 Ты в бункере':'💥 Тебя исключили'}</h2><p>${g.result==='survived'?'+150 чистыми · ставка возвращена':'Попробуй другую стратегию и открывай сильные карты раньше'}</p><div class="room-actions" style="justify-content:center;margin-top:13px"><button class="btn primary" data-bunker-new>Новая партия</button><button class="btn" data-bunker-lobby>В лобби</button></div></div>`:''}</div></main>`}
    function bindBunker(){const g=s.game;$$('[data-bunker-card]').forEach(b=>b.onclick=e=>{e.stopPropagation();bunkerHumanReveal(+b.dataset.bunkerCard)});$$('[data-bunker-vote]').forEach(b=>b.onclick=()=>{const i=+b.dataset.bunkerVote;if(g.phase==='vote'&&i!==0&&g.players[i].alive)bunkerHumanVote(i)});const n=$('[data-bunker-new]');if(n)n.onclick=()=>{s.view='room';s.game=null;save();render()};const l=$('[data-bunker-lobby]');if(l)l.onclick=()=>{s.view='lobby';s.game=null;save();render()};}
    function gameView(){
      const g=s.game,p=g.players[0],opp=g.players.slice(1),topTitle=`Партия ${g.round}`;
      const visiblePairs=g.table.length?g.table:(g.lastPair?[g.lastPair]:[]);
      const tableCards=visiblePairs.map(pair=>`<div class="played-pair"><div class="played-card ${pair.a.color==='red'?'red':''}" aria-label="Атака ${pair.a.rank} ${pair.a.suit}"><small class="played-label">Атака</small><span class="played-rank">${pair.a.rank}</span><span class="played-suit">${pair.a.suit}</span></div>${pair.d?`<div class="played-card ${pair.d.color==='red'?'red':''}" aria-label="Защита ${pair.d.rank} ${pair.d.suit}"><small class="played-label">Отбой</small><span class="played-rank">${pair.d.rank}</span><span class="played-suit">${pair.d.suit}</span></div>`:`<div class="played-card waiting" aria-label="${pair.took?'Карта забрана':'Ожидание защиты'}"><small class="played-label">${pair.took?'Забрана':'Ждём'}</small>?</div>`}</div>`).join('');
      const humanTurn=!g.over&&((g.phase==='attack'&&g.attacker===0)||(g.phase==='defend'&&g.defender===0));
      const phaseTitle=g.over?(g.winner===0?'Партия завершена':'Партия окончена'):g.phase==='resolve'?'Проверь результат':g.phase==='attack'?(g.attacker===0?'Твоя атака':'Атака бота'):(g.defender===0?'Твоя защита':'Защита бота');
      const phaseHint=g.over?'Можно начать новую партию или вернуться в комнату.':g.phase==='resolve'?'Карты остаются на столе — оцени ход и нажми «Следующий ход».':g.phase==='attack'&&g.attacker===0?'Выбери карту и нажми «Атаковать».':g.phase==='defend'&&g.defender===0?'Выбери карту с зелёной подсветкой или забери карту.':'Бот думает над ходом. Подожди, пока карта появится на столе.';
      const phaseIcon=g.over?'🏁':g.phase==='resolve'?'⏸️':g.phase==='attack'?'⚔️':'🛡️';
      const phaseState=g.over?'ГОТОВО':g.phase==='resolve'?'ПАУЗА':humanTurn?'ТВОЙ ХОД':'БОТ ДУМАЕТ';
      const cards=p.hand.map((c,i)=>{const legal=humanTurn&&((g.phase==='attack'&&g.attacker===0&&canAddAttack(c,g))||(g.phase==='defend'&&g.defender===0&&g.table[g.table.length-1]&&beats(c,g.table[g.table.length-1].a,g)));const cls=['card',c.color==='red'?'red':'',g.selected===i?'selected':'',!humanTurn?'locked':legal?'legal':'illegal'].filter(Boolean).join(' ');const hint=legal?'Можно сыграть':g.phase==='defend'?'Не подходит для отбивки':'Жди своего хода';return `<button class="${cls}" style="--i:${i}" data-card="${i}" data-legal="${legal?'1':'0'}" aria-label="${c.rank} ${c.suit}. ${hint}" ${legal?'':'disabled'}><span class="rank">${c.rank}</span><span class="suit">${c.suit}</span></button>`}).join('');
      const actionHint=g.phase==='defend'&&g.defender===0?`<div class="durak-action-hint"><b>Зелёные карты</b> — можно побить ${g.table[g.table.length-1]?.a.rank||''} ${g.table[g.table.length-1]?.a.suit||''}; серые карты не подходят.</div>`:g.phase==='attack'&&g.attacker===0?(g.table.length?'<div class="durak-action-hint"><b>Добавь карту того же достоинства</b> или заверши атаку.</div>':'<div class="durak-action-hint">Нажми на карту, чтобы выбрать её. Затем подтверди атаку.</div>'):g.phase==='resolve'?'<div class="durak-action-hint">Раунд остановлен специально, чтобы ты успел рассмотреть результат.</div>':'';
      return `<main class="app view"><div class="table-wrap">${top(topTitle,'‹ Комната')}<div class="game-top"><div class="game-title"><h1 class="gradient">Дурак</h1><p>Упрощённый режим · ${g.players.length} игрока</p></div><div class="game-status">${g.over?(g.winner===0?'ПОБЕДА':'ПАРТИЯ ОКОНЧЕНА'):g.phase==='attack'?'АТАКА':g.phase==='resolve'?'ПРОВЕРКА':'ЗАЩИТА'}<br><span style="color:var(--muted)">козырь ${g.trump}</span></div></div><div class="durak-help ${humanTurn?'your-turn':'waiting'}" role="status"><span class="phase-icon">${phaseIcon}</span><div><b>${phaseTitle}</b><small>${phaseHint}</small></div><span class="phase-state">${phaseState}</span></div><section class="table"><div class="opponents">${opp.map((x,i)=>{const idx=i+1;const backs=Array.from({length:Math.min(x.hand.length,6)},(_,j)=>`<span class="mini-back" style="--i:${j}" aria-hidden="true">V</span>`).join('');return `<div class="seat ${idx===g.attacker||idx===g.defender?'active':''}" aria-label="${esc(x.name)}, ${x.hand.length} карт"><div class="face">${x.face}</div><b>${esc(x.name)}</b><div class="opponent-cards">${backs}</div><small>${x.hand.length} карт${idx===g.attacker?' · атакует':''}${idx===g.defender?' · защищается':''}</small></div>`}).join('')}</div><div class="table-text">${esc(g.message)}</div><div class="center-zone" aria-label="Игровой стол"><div class="center-label">КАРТЫ НА СТОЛЕ</div><div class="played-zone">${tableCards||'<span class="played-empty">Пока пусто</span>'}</div><div class="deck" aria-label="Колода">${g.deck.length?g.deck.length+' карт':'—'}</div><div class="discard ${g.lastCard&&g.lastCard.color==='red'?'red':''}" aria-label="Последняя сыгранная карта">${g.lastCard?`<span>${g.lastCard.rank}<br>${g.lastCard.suit}</span>`:'♢'}</div></div><div class="my-seat"><div class="my-head"><span class="face">🙂</span><div><b>${esc(s.nick)}</b><small>${p.hand.length} карт · ${g.attacker===0?'ты атакуешь':g.defender===0?'ты защищаешься':g.phase==='resolve'?'посмотри результат':'наблюдаешь'}</small></div></div><div class="hand">${cards}</div><div class="actions">${g.over?`<button class="btn primary" data-new>Новая партия</button><button class="btn" data-lobby>В лобби</button>`:g.phase==='resolve'?`<button class="btn primary" data-continue>Следующий ход</button>`:g.phase==='attack'&&g.attacker===0?`${g.table.length?`<button class="btn primary" data-attack ${g.selected===null?'disabled':''}>Добавить карту</button><button class="btn" data-finish-attack>Завершить атаку</button>`:`<button class="btn primary" data-attack ${g.selected===null?'disabled':''}>Атаковать</button>`}`:g.phase==='defend'&&g.defender===0?`<button class="btn green" data-defend ${g.selected===null?'disabled':''}>Побить</button><button class="btn danger" data-take>Забрать</button>`:'<button class="btn" disabled>Бот думает…</button>'}</div>${actionHint}</div></section><div class="legend durak-legend"><span><i class="legal-dot"></i>можно сыграть</span><span><i class="illegal-dot"></i>карта не подходит</span><span>♣♠ чёрные масти</span><span>♥♦ красные масти</span></div></div></main>`
    }
    function bindGame(){$$('[data-card]').forEach(b=>b.onclick=()=>{const g=s.game;if(!g||g.phase==='resolve'||b.disabled)return;if(b.dataset.legal!=='1')return toast(g.phase==='defend'?'Эта карта не может побить атаку':'Сейчас ход бота','bad');g.selected=+b.dataset.card;render()});const a=$('[data-attack]');if(a)a.onclick=playAttack;const d=$('[data-defend]');if(d)d.onclick=humanDefend;const t=$('[data-take]');if(t)t.onclick=humanTake;const f=$('[data-finish-attack]');if(f)f.onclick=finishAttack;const c=$('[data-continue]');if(c)c.onclick=continueRound;const n=$('[data-new]');if(n)n.onclick=()=>{s.view='room';s.game=null;save();render()};const l=$('[data-lobby]');if(l)l.onclick=()=>{s.view='lobby';s.game=null;save();render()}}
    function helpModal(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="close" data-close>×</button><div class="eyebrow">VEZDEHOT · БЫСТРАЯ СПРАВКА</div><h2>Как начать игру</h2><p>Выбери активную игру в лобби, настрой ботов и нажми «Начать». В «Бункере» сначала открывается одна зелёная карта, затем выбирается игрок на выбывание.</p><div class="hint-line"><span>🟢</span><span><b>Зелёная карта</b> — действие доступно сейчас.</span></div><div class="hint-line"><span>🗳️</span><span><b>Голосование</b> — нажми на игрока, которого не берёшь.</span></div><div class="hint-line"><span>💾</span><span><b>Сохранение</b> — баланс и прогресс хранятся автоматически.</span></div><div class="room-actions" style="margin-top:15px"><button class="btn primary" data-close>Понятно</button></div></div>`;document.body.appendChild(m);$$('[data-close]',m).forEach(b=>b.onclick=()=>m.remove())}
    function settings(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="close" data-close>×</button><h2>Профиль</h2><p>Имя показывается в комнате и на столе.</p><label class="label">Никнейм</label><input class="input" maxlength="16" value="${esc(s.nick)}" data-nick><div class="room-actions" style="margin-top:15px"><button class="btn primary" data-save>Сохранить</button></div></div>`;document.body.appendChild(m);$('[data-close]',m).onclick=()=>m.remove();$('[data-save]',m).onclick=()=>{const n=$('[data-nick]',m).value.trim();if(n.length<2)return toast('Минимум 2 символа','bad');s.nick=n;save();m.remove();render()}}
    window.addEventListener('beforeunload',()=>save());
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
    window.addEventListener('load',()=>initCloud(),{once:true});
  })();
  </script>
</body>
</html>
