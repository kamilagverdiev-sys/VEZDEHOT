    function deck(){const d=[];for(const [suit,color] of suits)for(const rank of ranks)d.push({rank,suit,color,id:rank+suit});return d}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    // Durak: one attacker per round, explicit review, cancellable bot turns.
    const DURAK_ENGINE_VERSION = 3;
    let durakTimer = null, durakTimerTicket = 0;
    function clearDurakTimer(){

      durakTimer=null;
      durakTimerTicket++;
    }
    function durakDelay(){const pace=s.durakPace||'calm';return pace==='calm'?2300:pace==='quick'?1100:1700}
    function durakId(){return 'durak-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
    function normalizeDurakGame(g){
      if(!g||!Array.isArray(g.players)||!Array.isArray(g.deck))return g;
      const legacy=g.engineVersion!==DURAK_ENGINE_VERSION;
      g.id=g.id||durakId();g.table=g.table||[];g.finished=Array.isArray(g.finished)?g.finished:[];
      g.draw=!!g.draw;g.paused=!!g.paused;

        // Undo that staging once; the next-round transition will transfer them.
        const h=g.players[g.defender].hand;
        for(const c of g.table.flatMap(p=>p.d?[p.a,p.d]:[p.a])){
          const index=h.findIndex(x=>x.id===c.id||(x.rank===c.rank&&x.suit===c.suit));
          if(index>=0)h.splice(index,1);
        }
        g.resolve.prepared=false;
      }
      if(legacy&&g.phase==='resolve'&&g.resolve?.took){
        g.pendingRound={took:true,attacker:g.attacker,defender:g.defender};g.phase='roundEnd';
      }
      if(legacy&&g.over)g.settled=true; // A historical result has already paid out.
      const visible=g.table.reduce((n,p)=>n+1+(p.d?1:0),0);
      if(!Number.isFinite(g.discardCount))g.discardCount=Math.max(0,36-g.deck.length-g.players.reduce((n,p)=>n+p.hand.length,0)-visible);
      if(g.trumpCard===undefined)g.trumpCard=null; // Old saves did not record the exposed card.
      if(!g.deck.length&&!g.over)g.players.forEach((p,i)=>{if(!p.hand.length&&!g.table.length&&!g.finished.includes(i))g.finished.push(i)});
      g.engineVersion=DURAK_ENGINE_VERSION;

    function scheduleDurak(g,action){

      const ticket=durakTimerTicket,id=g.id,phase=g.phase;
      durakTimer=setTimeout(()=>{
        durakTimer=null;

    function startGame(r){
      clearDurakTimer();
      if(r.stake)s.balance-=r.stake;
      s.game={...newGame(r),reserved:r.stake};s.view='game';save();render();advance();
    }
    function newGame(r){
      const d=shuffle(deck()),players=[{name:s.nick,face:'🙂',kind:'human',hand:[]},...Array.from({length:r.bots},(_,i)=>({name:botNames[i],face:avatars[i],kind:'bot',hand:[]}))];
      for(let card=0;card<6;card++)players.forEach(p=>p.hand.push(d.pop()));
      const g={engineVersion:DURAK_ENGINE_VERSION,id:durakId(),players,deck:d,trump:d[0].suit,trumpCard:{...d[0]},attacker:0,defender:1,phase:'attack',table:[],roundLimit:null,selected:null,message:'',diff:r.diff,stake:r.stake,round:1,over:false,winner:null,loser:null,draw:false,finished:[],discardCount:0,lastCard:null,lastPair:null,resolve:null,pendingRound:null,paused:false,settled:false};
      let lowest=Infinity;
      players.forEach((p,i)=>{sortHand(p.hand,g);for(const c of p.hand){const value=ranks.indexOf(c.rank);if(isTrump(c,g)&&value<lowest){lowest=value;g.attacker=i}}});
      g.defender=(g.attacker+1)%players.length;
      g.message=g.attacker===0?'У тебя младший козырь. Выбери карту для атаки':players[g.attacker].name+' начинает: у него младший козырь';

    }
    function isTrump(c,g){return !!c&&c.suit===g.trump}
    function beats(def,atk,g){if(!def||!atk)return false;if(def.suit===atk.suit)return ranks.indexOf(def.rank)>ranks.indexOf(atk.rank);return isTrump(def,g)&&!isTrump(atk,g)}
    function sortHand(h,g){h.sort((a,b)=>(isTrump(a,g)?1:0)-(isTrump(b,g)?1:0)||suits.findIndex(x=>x[0]===a.suit)-suits.findIndex(x=>x[0]===b.suit)||ranks.indexOf(a.rank)-ranks.indexOf(b.rank))}
    function drawUp(i,g){if(g.finished.includes(i))return;while(g.players[i].hand.length<6&&g.deck.length)g.players[i].hand.push(g.deck.pop());sortHand(g.players[i].hand,g)}
    function botCard(i,g){
      const h=g.players[i].hand.slice().sort((a,b)=>(isTrump(a,g)?1:0)-(isTrump(b,g)?1:0)||ranks.indexOf(a.rank)-ranks.indexOf(b.rank));
      if(g.diff==='easy'&&Math.random()<.4)return h[Math.floor(Math.random()*h.length)];

      return h[0];

    function canAddAttack(c,g){
      if(!c)return false;

      if(g.table.length>=(g.roundLimit||6)||g.table.some(p=>!p.d))return false;

    function chooseDefense(i,g){

      const h=g.players[i].hand.filter(c=>beats(c,pair.a,g)).sort((a,b)=>(isTrump(a,g)?1:0)-(isTrump(b,g)?1:0)||ranks.indexOf(a.rank)-ranks.indexOf(b.rank));

    function showResolve(g,took=false){

      g.message=g.attacker===0?'Отбито. Можно подкинуть карту того же достоинства или завершить атаку':'Отбито. Рассмотри карты и продолжи, когда будешь готов';
      save();render();
    }
    function continueRound(){
      const g=s.game;if(!g||s.view!=='game'||g.over||g.paused)return;
      normalizeDurakGame(g);clearDurakTimer();

      g.message=g.attacker===0?'Добавь карту того же достоинства или заверши атаку':g.players[g.attacker].name+' решает, подкинуть ли ещё';

    function finishAttack(){

    function endRound(g,took=false){

    function nextDurakPlayer(g,from){for(let step=1;step<=g.players.length;step++){const i=(from+step)%g.players.length;if(!g.finished.includes(i))return i}return null}
    function commitDurakRound(g){

    function durakHand(g){return g.players[0].hand.map((c,i)=>{const legal=legalHumanCard(c,g);return `<button class="dt-card dt-hand-card ${c.color} ${legal?'is-legal':'is-locked'} ${g.selected===i?'is-selected':''}" data-key="hand-${c.id}" data-card-id="${c.id}" data-card="${i}" data-legal="${legal?'1':'0'}" aria-pressed="${g.selected===i}" aria-label="${c.rank} ${c.suit}${isTrump(c,g)?', козырь':''}. ${legal?'Можно сыграть':'Сейчас нельзя сыграть'}" ${legal?'':'disabled'}>${cardFace(c)}${isTrump(c,g)?'<span class="dt-trump-mark" aria-hidden="true">КОЗЫРЬ</span>':''}</button>`}).join('')}
    function durakActions(g){
      if(g.over)return '<button class="dt-button primary" data-new>Новая партия</button><button class="dt-button" data-lobby>В лобби</button>';
      if(g.paused)return '<button class="dt-button primary" data-resume>Продолжить игру</button>';
      if(g.phase==='roundEnd')return '<button class="dt-button primary" data-continue>Следующий раунд <span>→</span></button>';
      if(g.phase==='resolve'&&(g.resolve?.took||g.attacker!==0))return '<button class="dt-button primary" data-continue>Продолжить <span>→</span></button>';
      if(canHumanAttack(g)||g.phase==='resolve'&&g.attacker===0)return `${canHumanAttack(g)?`<button class="dt-button primary" data-attack ${g.selected===null?'disabled':''}>${g.table.length?'Подкинуть':'Атаковать'}</button>`:''}${g.table.length?'<button class="dt-button" data-finish-attack>Бито</button>':''}`;
      if(g.phase==='defend'&&g.defender===0)return `<button class="dt-button primary" data-defend ${g.selected===null?'disabled':''}>Побить</button><button class="dt-button" data-take>Забрать карты</button>`;
      return '<span class="dt-thinking"><i></i><i></i><i></i> Ход соперника</span>';
    }
    function gameView(){
      const g=s.game,info=durakStatus(g),human=g.players[0],active=human.hand.some(c=>legalHumanCard(c,g)),trump=g.trumpCard,done=(g.finished||[]).includes(0),pace=s.durakPace||'calm';
      return `<main class="durak-app" data-key="durak-${g.id}"><header class="dt-top"><button class="dt-icon" data-game-back aria-label="Вернуться в комнату">‹</button><a href="./" class="dt-brand" data-game-brand>VEZDEHOT<span>Дурак · соло</span></a><div class="dt-header-right"><span class="dt-balance">${fmt(s.balance)} <small>V</small></span><button class="dt-icon" data-durak-help aria-label="Правила Дурака">?</button><button class="dt-icon" data-pause aria-label="${g.paused?'Продолжить игру':'Пауза'}" ${g.over?'disabled':''}>${g.paused?'▶':'Ⅱ'}</button></div></header>
      <section class="dt-shell"><div class="dt-table-meta"><span><i></i> ${g.players.length} ИГРОКА · 36 КАРТ</span><span>РАУНД ${g.round}</span></div><div class="dt-felt"><div class="dt-opponents" style="--players:${g.players.length-1}">${durakOpponents(g)}</div>
      <div class="dt-stockbar"><div class="dt-stock"><div class="dt-stock-cards" aria-hidden="true">${trump&&g.deck.length?`<span class="dt-trump-face ${trump.color}">${trump.rank}${trump.suit}</span>`:''}${g.deck.length?'<span class="dt-back">V</span>':'<span class="dt-stock-empty">∅</span>'}</div><span><b>${g.deck.length}</b> в колоде</span></div><span class="dt-trump ${g.trump==='♥'||g.trump==='♦'?'red':''}"><b>${g.trump}</b> Козырь</span><span class="dt-discard"><b>${g.discardCount||0}</b> в отбое</span></div>
      <div class="dt-battle-wrap"><div class="dt-watermark" aria-hidden="true">VEZDEHOT <span>PLAY AT YOUR PACE</span></div><div class="dt-battle" aria-label="Карты на столе: атака слева, защита сверху справа">${durakBattle(g)}</div>${!g.table.length?`<div class="dt-empty">${g.over?'Партия завершена':g.attacker===0?'Твой первый ход':'Ожидаем атаку'}<small>Атака слева · защита сверху</small></div>`:''}</div>
      <div class="dt-round-note"><span>${g.table.length?`${g.table.length} из ${g.roundLimit||6} пар`:'Стол свободен'}</span><span>Подкидывает только атакующий</span></div></div>
      <section class="dt-control ${active?'your-turn':''}"><div class="dt-status" role="status" aria-live="polite"><span class="dt-status-icon">${g.paused?'Ⅱ':g.over?'✓':active?'↗':g.phase==='resolve'||g.phase==='roundEnd'?'Ⅱ':'·'}</span><div><h1>${esc(info[0])}</h1><p>${esc(info[1])}</p></div></div>
      <div class="dt-hand-head"><b>${esc(human.name)} <span>· ${done?'вышел из игры':human.hand.length+' карт'}</span></b><span>${human.hand.length>6?'Листай руку ↔':'Твоя рука'}</span></div><div class="dt-hand" data-key="hand" aria-label="Твои карты">${durakHand(g)}</div><div class="dt-selected" data-selection-note>${g.selected!==null&&human.hand[g.selected]?'Выбрано: '+human.hand[g.selected].rank+human.hand[g.selected].suit:active?'Светлая обводка — карту можно сыграть':done?'Ты вышел. Досмотри партию в своём темпе.':'Карты сохраняют свои места между ходами'}</div><div class="dt-actions">${durakActions(g)}</div></section></section>
      <footer class="dt-footer"><label>Темп ботов <select data-pace aria-label="Темп ботов"><option value="calm" ${pace==='calm'?'selected':''}>Спокойный</option><option value="normal" ${pace==='normal'?'selected':''}>Обычный</option><option value="quick" ${pace==='quick'?'selected':''}>Быстрый</option></select></label><span>Без таймера на твой ход</span></footer></main>`;
    }
    // Keep card nodes and scroll positions; only animate the card that actually moves.
    function syncDurakNode(oldNode,newNode){
      if(oldNode.nodeType!==newNode.nodeType||oldNode.nodeName!==newNode.nodeName){oldNode.replaceWith(newNode);return}
      if(oldNode.nodeType===3){if(oldNode.nodeValue!==newNode.nodeValue)oldNode.nodeValue=newNode.nodeValue;return}
      if(oldNode.nodeType!==1)return;
      for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
      for(const a of [...newNode.attributes])if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
      const keyed=new Map([...oldNode.children].filter(e=>e.dataset.key).map(e=>[e.dataset.key,e]));
      let pos=0;
      for(const next of [...newNode.childNodes]){let current=oldNode.childNodes[pos];const key=next.nodeType===1?next.dataset.key:null;if(key){const match=keyed.get(key);if(match&&match!==current){oldNode.insertBefore(match,current||null);current=match}else if(!match){oldNode.insertBefore(next,current||null);pos++;continue}}
        if(!current)oldNode.appendChild(next);else syncDurakNode(current,next);pos++;
      }
      while(oldNode.childNodes.length>pos)oldNode.lastChild.remove();
    }
    function updateDurakView(app){
      const old=app.querySelector('.durak-app'),positions=new Map();
      if(old)old.querySelectorAll('[data-card-id]').forEach(e=>positions.set(e.dataset.cardId,e.getBoundingClientRect()));
      const tpl=document.createElement('template');tpl.innerHTML=gameView();const next=tpl.content.firstElementChild;
      if(old&&old.dataset.key===next.dataset.key)syncDurakNode(old,next);else app.replaceChildren(next);
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){app.querySelectorAll('[data-card-id]').forEach(e=>{const before=positions.get(e.dataset.cardId),after=e.getBoundingClientRect();if(before){const x=before.left-after.left,y=before.top-after.top;if(Math.abs(x)>2||Math.abs(y)>2)e.animate([{translate:`${x}px ${y}px`},{translate:'0 0'}],{duration:340,easing:'cubic-bezier(.2,.7,.2,1)'});}else if(!old||e.classList.contains('dt-defense')||e.classList.contains('dt-attack'))e.animate([{opacity:0,translate:'0 -12px'},{opacity:1,translate:'0 0'}],{duration:300,easing:'ease-out'});});}
    }
    function paintDurakSelection(){const g=s.game;$$('[data-card]').forEach(b=>{const selected=+b.dataset.card===g.selected;b.classList.toggle('is-selected',selected);b.setAttribute('aria-pressed',String(selected))});const action=$('[data-attack]')||$('[data-defend]');if(action)action.disabled=g.selected===null;const note=$('[data-selection-note]'),c=g.players[0].hand[g.selected];if(note)note.textContent=c?`Выбрано: ${c.rank}${c.suit} · подтверди ход кнопкой`:'Выбери подходящую карту';}
    function bindGame(){
      $$('[data-card]').forEach(b=>b.onclick=()=>{const g=s.game,i=+b.dataset.card;if(!g||!legalHumanCard(g.players[0].hand[i],g))return;g.selected=g.selected===i?null:i;paintDurakSelection();save()});
      const bind=(sel,fn)=>{const el=$(sel);if(el)el.onclick=fn};
      bind('[data-attack]',playAttack);bind('[data-defend]',humanDefend);bind('[data-take]',humanTake);bind('[data-finish-attack]',finishAttack);bind('[data-continue]',continueRound);
      const pause=()=>{clearDurakTimer();s.game.paused=!s.game.paused;s.game.selected=null;save();render();if(!s.game.paused)advance()};bind('[data-pause]',pause);bind('[data-resume]',pause);
      const leave=(view)=>{clearDurakTimer();s.view=view;save();render()};bind('[data-game-back]',()=>leave('room'));const brand=$('[data-game-brand]');if(brand)brand.onclick=e=>{e.preventDefault();leave('lobby')};bind('[data-new]',()=>{clearDurakTimer();s.game=null;s.view='room';save();render()});bind('[data-lobby]',()=>leave('lobby'));
      bind('[data-durak-help]',durakHelp);const pace=$('[data-pace]');if(pace)pace.onchange=()=>{s.durakPace=pace.value;save();clearDurakTimer();advance()};
    }
    function durakHelp(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Правила Дурака"><button class="close" data-close aria-label="Закрыть">×</button><div class="eyebrow">ДУРАК · СПОКОЙНЫЙ СТОЛ</div><h2>Каждый ход — в твоём темпе</h2><p>Выбери карту, затем подтверди действие. Старшая карта той же масти бьёт младшую. Козырь бьёт любую некозырную карту.</p><p>В этой версии подкидывает только атакующий: достоинство должно совпадать с любой картой на столе. За раунд — до шести пар и не больше, чем было карт у защитника. После объявления взятия новые карты не подкидываются.</p><p>После отбивки можно подкинуть или нажать «Бито». Если защитник забрал, следующий ход у игрока после него. Без колоды игроки выходят по очереди; оставшийся с картами проигрывает.</p><p>Карты не исчезнут без твоего нажатия. Темп ботов меняется под столом, а кнопка Ⅱ останавливает игру.</p><button class="btn primary" data-close>Понятно</button></div>`;document.body.appendChild(m);clearDurakTimer();const close=()=>{m.remove();advance()};$$('[data-close]',m).forEach(b=>b.onclick=close);m.onkeydown=e=>{if(e.key==='Escape')close()};$('[data-close]',m).focus()}
    function helpModal(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="close" data-close>×</button><div class="eyebrow">VEZDEHOT · БЫСТРАЯ СПРАВКА</div><h2>Как начать игру</h2><p>Выбери активную игру в лобби, настрой ботов и нажми «Начать». В «Бункере» сначала открывается одна зелёная карта, затем выбирается игрок на выбывание.</p><div class="hint-line"><span>🟢</span><span><b>Зелёная карта</b> — действие доступно сейчас.</span></div><div class="hint-line"><span>🗳️</span><span><b>Голосование</b> — нажми на игрока, которого не берёшь.</span></div><div class="hint-line"><span>💾</span><span><b>Сохранение</b> — баланс и прогресс хранятся автоматически.</span></div><div class="room-actions" style="margin-top:15px"><button class="btn primary" data-close>Понятно</button></div></div>`;document.body.appendChild(m);$$('[data-close]',m).forEach(b=>b.onclick=()=>m.remove())}
    function settings(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="close" data-close>×</button><h2>Профиль</h2><p>Имя показывается в комнате и на столе.</p><label class="label">Никнейм</label><input class="input" maxlength="16" value="${esc(s.nick)}" data-nick><div class="room-actions" style="margin-top:15px"><button class="btn primary" data-save>Сохранить</button></div></div>`;document.body.appendChild(m);$('[data-close]',m).onclick=()=>m.remove();$('[data-save]',m).onclick=()=>{const n=$('[data-nick]',m).value.trim();if(n.length<2)return toast('Минимум 2 символа','bad');s.nick=n;save();m.remove();render()}}
    window.addEventListener('beforeunload',()=>save());
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    if(s.game?.players?.[0]?.hand){normalizeDurakGame(s.game);save()}
    document.addEventListener('visibilitychange',()=>{if(document.hidden)clearDurakTimer();else if(s.view==='game'&&!$('.modal-bg'))advance()});
    render();
    if(s.view==='game')advance();
    window.addEventListener('load',()=>initCloud(),{once:true});
  })();
  </script>
</body>
</html>
