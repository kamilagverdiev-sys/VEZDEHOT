    function deck(){const d=[];for(const [suit,color] of suits)for(const rank of ranks)d.push({rank,suit,color,id:rank+suit});return d}

      const leave=(view)=>{clearDurakTimer();s.view=view;save();render()};bind('[data-game-back]',()=>leave('room'));const brand=$('[data-game-brand]');if(brand)brand.onclick=e=>{e.preventDefault();leave('lobby')};bind('[data-new]',replayDurak);bind('[data-game-settings]',()=>leave('room'));bind('[data-lobby]',()=>leave('lobby'));
      bind('[data-durak-help]',durakHelp);const pace=$('[data-pace]');if(pace)pace.onchange=()=>{s.durakPace=pace.value;save();clearDurakTimer();advance()};
    }
    function durakHelp(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Правила Дурака"><button class="close" data-close aria-label="Закрыть">×</button><div class="eyebrow">ДУРАК · СПОКОЙНЫЙ СТОЛ</div><h2>Каждый ход — в твоём темпе</h2><p>Выбери карту, затем подтверди действие. Старшая карта той же масти бьёт младшую. Козырь бьёт любую некозырную карту.</p><p>В этой версии подкидывает только атакующий: достоинство должно совпадать с любой картой на столе. За раунд — до шести пар и не больше, чем было карт у защитника. После объявления взятия новые карты не подкидываются.</p><p>После отбивки можно подкинуть или нажать «Бито». Если защитник забрал, следующий ход у игрока после него. Без колоды игроки выходят по очереди; оставшийся с картами проигрывает.</p><p>Карты не исчезнут без твоего нажатия. Темп ботов меняется под столом, а кнопка Ⅱ останавливает игру.</p><button class="btn primary" data-close>Понятно</button></div>`;document.body.appendChild(m);clearDurakTimer();const close=()=>{m.remove();advance()};$$('[data-close]',m).forEach(b=>b.onclick=close);m.onkeydown=e=>{if(e.key==='Escape')close()};$('[data-close]',m).focus()}
    function helpModal(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><button class="close" data-close>×</button><div class="eyebrow">VEZDEHOT · БЫСТРАЯ СПРАВКА</div><h2>Как начать игру</h2><p>Выбери активную игру в лобби, настрой ботов и нажми «Начать». В «Бункере» сначала открывается одна зелёная карта, затем выбирается игрок на выбывание.</p><div class="hint-line"><span>🟢</span><span><b>Зелёная карта</b> — действие доступно сейчас.</span></div><div class="hint-line"><span>🗳️</span><span><b>Голосование</b> — нажми на игрока, которого не берёшь.</span></div><div class="hint-line"><span>💾</span><span><b>Сохранение</b> — баланс и прогресс хранятся автоматически.</span></div><div class="room-actions" style="margin-top:15px"><button class="btn primary" data-close>Понятно</button></div></div>`;document.body.appendChild(m);$$('[data-close]',m).forEach(b=>b.onclick=()=>m.remove())}
    function settings(){window.VEZDEHOT.openAccount()}
    document.addEventListener('vezdehot:accountchange',()=>{accountChanging=true;clearDurakTimer();if(s.game)s.game.paused=true;document.getElementById('app').style.pointerEvents='none'});
    document.addEventListener('vezdehot:profile',e=>{if(accountChanging)return;Object.assign(s,e.detail);if(s.view==='lobby')render();else if(s.view==='room')render()});
    window.addEventListener('beforeunload',()=>save());
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    if(s.game?.players?.[0]?.hand){normalizeDurakGame(s.game);save()}
    document.addEventListener('visibilitychange',()=>{if(document.hidden){clearDurakTimer();if(s.view==='game'&&s.game&&!s.game.over){s.game.paused=true;save()}}else if(s.view==='game')render()});
    render();
    if(s.view==='game')advance();
    const launch=new URLSearchParams(location.search);if(launch.get('view')==='lobby'){clearDurakTimer();s.view='lobby';save();render()}if(['durak','bunker'].includes(launch.get('game'))){const mode=launch.get('game');s.view='room';s.room={code:code(),bots:mode==='bunker'?5:2,diff:'normal',stake:mode==='bunker'?100:0,mode};save();render();history.replaceState(null,'',location.pathname)}if(launch.get('profile')==='1')window.VEZDEHOT.openAccount();
  })();
  </script>
