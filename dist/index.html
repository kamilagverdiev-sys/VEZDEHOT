    function room(){const r=s.room||{code:code(),bots:2,diff:'normal',stake:0,mode:'durak'};if(r.mode==='bunker')return bunkerRoom(r);return `<main class="app view setup"><div class="room-wrap">${top('Личный стол','‹ Все игры')}${mainSaveNotice('durak')}<section class="setup-heading"><div><div class="eyebrow">КАРТОЧНАЯ КЛАССИКА / 01</div><h1>Дурак<span>Твой стол. Твой темп.</span></h1><p>Собери компанию ботов и разыграй партию.<br>Карты остаются на столе, пока ты не продолжишь.</p></div><div class="setup-card-art" aria-hidden="true"><i>6<small>♠</small></i><i>A<small>♥</small></i></div></section><section class="panel room-panel"><div class="label">Компания за столом</div><div class="members"><div class="member"><div class="face">${esc(s.avatar||'✦')}</div><b>${esc(s.nick)}</b><small>ты</small></div>${Array.from({length:r.bots},(_,i)=>`<div class="member"><div class="face">${['Л','В','Д'][i]}</div><b>${botNames[i]}</b><small>бот · ${r.diff==='easy'?'спокойный':r.diff==='hard'?'сильный':'обычный'}</small></div>`).join('')}</div></section><section class="panel room-panel"><div class="label">Сколько соперников?</div><div class="seg" data-bot-count>${[1,2,3].map(n=>`<button data-bots="${n}" aria-pressed="${r.bots===n}" class="${r.bots===n?'on':''}">${n} ${n===1?'бот':'бота'}</button>`).join('')}</div><div class="label setup-gap">Сложность</div><div class="seg" data-diff>${[['easy','Разогрев'],['normal','Обычная'],['hard','Вызов']].map(([v,l])=>`<button data-diff-value="${v}" aria-pressed="${r.diff===v}" class="${r.diff===v?'on':''}">${l}</button>`).join('')}</div><div class="label setup-gap">Игровые монеты</div><div class="seg" data-stake>${[0,100,500,1000].map(v=>`<button data-stake-value="${v}" aria-pressed="${r.stake===v}" class="${r.stake===v?'on':''}">${v?fmt(v)+' V':'Без ставки'}</button>`).join('')}</div><p class="setup-footnote">Монеты — часть игры. Без покупки, денежных ставок и вывода.</p></section><div class="room-note">36 карт · 2–4 игрока · подкидывает тольк     function bindRoom(){const r=s.room;const training=$('[data-durak-training]');if(training)training.onclick=()=>openMainGuide('durak','walkthrough');const scenario=$('[data-bunker-scenario]');if(scenario)scenario.onchange=()=>{if(!mainWritable()){scenario.value=normalizeBunkerChoice(r.scenarioChoice);return}r.scenarioChoice=normalizeBunkerChoice(scenario.value);scenario.value=r.scenarioChoice;const preview=$('[data-bunker-scenario-preview]');if(preview)preview.innerHTML=bunkerScenarioPreview(r.scenarioChoice);save()};const resume=$('[data-resume-game]');if(resume)resume.onclick=()=>{if(!mainWritable())return;s.view=r.mode==='bunker'?'bunker':'game';if(r.mode!=='bunker')s.game.paused=false;save();render();if(r.mode!=='bunker')advance()};$$('[data-bots]').forEach(b=>b.onclick=()=>{r.bots=+b.dataset.bots;save();render()});$$('[data-diff-value]').forEach(b=>b.onclick=()=>{r.diff=b.dataset.diffValue;save();render()});$$('[data-stake-value]').forEach(b=>b.onclick=()=>{r.stake=+b.dataset.stakeValue;save();render()});$('[data-start]').onclick=()=>{const begin=()=>{if(!mainWritable())return;if(r.mode==='bunker'){if(s.balance<100)return toast('Для Бункера нужна ставка 100 монет','bad');startBunker(r);return}if(r.stake&&s.balance<r.stake)return toast('Недостаточно монет','bad');startGame(r)};if(s.game&&!s.game.over&&mainGameKind(s.game)===(r.mode||'durak'))confirmRestart(begin,r);else begin()}}
    function confirmRestart(begin,r){const previous=document.activeElement,background=document.getElementById('app'),wasInert=background.inert,m=document.createElement('div');background.inert=true;m.className='modal-bg';m.innerHTML=`<section class="modal restart-dialog" role="dialog" aria-modal="true" aria-labelledby="restart-title"><span class="eyebrow">НЕЗАВЕРШЁННАЯ ПАРТИЯ</span><h2 id="restart-title">Начать заново?</h2><p>Текущая партия в «${r.mode==='bunker'?'Бункере':'Дураке'}» будет заменена. ${s.game.stake?'Уже внесённые '+fmt(s.game.stake)+' V не возвращаются.':'Прогресс этой партии будет сброшен.'}</p><p>Новый вход: <b>${r.mode==='bunker'?'100 V':r.stake?fmt(r.stake)+' V':'без ставки'}</b>. Другие игры сохранятся.</p><div class="room-actions"><button class="btn primary" data-keep>Оставить партию</button><button class="btn" data-restart>Начать заново</button></div></section>`;document.body.appendChild(m);const close=()=>{m.remove();background.inert=wasInert;previous?.focus?.()};$('[data-keep]',m).onclick=close;$('[data-restart]',m).onclick=()=>{m.remove();background.inert=wasInert;begin()};m.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){e.preventDefault();const first=$('[data-keep]',m),last=$('[data-restart]',m);(document.activeElement===first?last:first).focus()}};$('[data-keep]',m).focus()}

    function canPlayDurakCardId(id){const g=s.game;if(!g||s.view!=='game'||g.players[0].kind!=='human'||document.hidden||typeof mainWritable==='function'&&!mainWritable())return false;const c=g.players[0].hand.find(c=>c.id===id);return !!c&&legalHumanCard(c,g)}
    function playDurakCardById(id,expectedKey){if(expectedKey!==durakInteractionKey()||!canPlayDurakCardId(id))return false;const g=s.game,index=g.players[0].hand.findIndex(c=>c.id===id);if(index<0)return false;g.selected=index;if(canHumanAttack(g))playAttack();else if(g.phase==='defend'&&g.defender===0)humanDefend();else return false;return !g.players[0].hand.some(c=>c.id===id)}
    function bindDurakCards(){destroyDurakCards();const root=$('.durak-app');if(!root||!window.VEZDEHOT_CARDS)return;const key=durakInteractionKey();durakCardGesture=window.VEZDEHOT_CARDS.bind({root,cardSelector:'.dt-hand-card',dropSelector:'[data-durak-drop]',getCardId:card=>card.dataset.cardId,canStart:canPlayDurakCardId,canDrop:canPlayDurakCardId,getStateKey:durakInteractionKey,onDrop:id=>playDurakCardById(id,key)})}
    // Keep card nodes and scroll positions; only animate the card that actually moves.
    function syncDurakNode(oldNode,newNode){
      if(oldNode.nodeType!==newNode.nodeType||oldNode.nodeName!==newNode.nodeName){oldNode.replaceWith(newNode);return}
      if(oldNode.nodeType===3){if(oldNode.nodeValue!==newNode.nodeValue)oldNode.nodeValue=newNode.nodeValue;return}
      if(oldNode.nodeType!==1)return;
      if(oldNode.nodeName==='DETAILS'&&oldNode.hasAttribute('open'))newNode.setAttribute('open','');
      for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
      for(const a of [...newNode.attributes])if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
      const keyed=new Map([...oldNode.children].filter(e=>e.dataset.key).map(e=>[e.dataset.key,e]));
      let pos=0;
      for(const next of [...newNode.childNodes]){let current=oldNode.childNodes[pos];const key=next.nodeType===1?next.dataset.key:null;if(key){const match=keyed.get(key);if(match&&match!==current){oldNode.insertBefore(match,current||null);current=match}else if(!match){oldNode.insertBefore(next,current||null);pos++;continue}}
        if(!current)oldNode.appendChild(next);else syncDurakNode(current,next);pos++;
      }
      while(oldNode.childNodes.length>pos)oldNode.lastChild.remove();
    }
    function updateDurakView(app){
      destroyDurakCards();
      const old=app.querySelector('.durak-app'),positions=new Map();
      if(old)old.querySelectorAll('[data-card-id]').forEach(e=>positions.set(e.dataset.cardId,e.getBoundingClientRect()));
      const tpl=document.createElement('template');tpl.innerHTML=gameView();const next=tpl.content.firstElementChild;
      if(old&&old.dataset.key===next.dataset.key)syncDurakNode(old,next);else app.replaceChildren(next);
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&document.documentElement.dataset.motion!=='reduced'){app.querySelectorAll('[data-card-id]').forEach(e=>{const before=positions.get(e.dataset.cardId),after=e.getBoundingClientRect();if(before){const x=before.left-after.left,y=before.top-after.top;if(Math.abs(x)>2||Math.abs(y)>2)e.animate([{translate:`${x}px ${y}px`},{translate:'0 0'}],{duration:340,easing:'cubic-bezier(.2,.7,.2,1)'});}else if(!old||e.classList.contains('dt-defense')||e.classList.contains('dt-attack'))e.animate([{opacity:0,translate:'0 -12px'},{opacity:1,translate:'0 0'}],{duration:300,easing:'ease-out'});});}
    }
    function paintDurakSelection(){const g=s.game;$$('[data-card]').forEach(b=>{const selected=+b.dataset.card===g.selected;b.classList.toggle('is-selected',selected);b.setAttribute('aria-pressed',String(selected))});const attack=$('[data-attack]'),action=attack||$('[data-defend]'),c=g.players[0].hand[g.selected],legal=!!c&&legalHumanCard(c,g);if(action){action.disabled=!legal;action.textContent=(attack?(g.table.length?'Подкинуть':'Сыграть'):'Отбить')+(legal?' '+c.rank+c.suit:' карту')}const note=$('[data-selection-note]');if(note)note.textContent=durakSelectionText(g);}
    function bindGame(){
      $$('[data-card]').forEach(b=>b.onclick=()=>{if(!mainWritable()||document.hidden)return;const g=s.game,i=g?.players[0].hand.findIndex(c=>c.id===b.dataset.cardId);if(!g||s.view!=='game'||g.over||g.paused||g.players[0].kind!=='human'||i<0)return;g.selected=g.selected===i?null:i;paintDurakSelection()});
      const bind=(sel,fn)=>{const el=$(sel);if(el)el.onclick=fn};
      bind('[data-attack]',playAttack);bind('[data-defend]',humanDefend);bind('[data-take]',humanTake);bind('[data-finish-attack]',finishAttack);bind('[data-continue]',continueRound);
      const pause=()=>{if(!mainWritable())return;clearDurakTimer();s.game.paused=!s.game.paused;s.game.selected=null;save();render();if(!s.game.paused)advance()};bind('[data-pause]',pause);bind('[data-resume]',pause);
      const leave=(view)=>{clearDurakTimer();s.view=view;save();render()};bind('[data-game-back]',()=>leave('room'));const brand=$('[data-game-brand]');if(brand)brand.onclick=e=>{e.preventDefault();leave('lobby')};bind('[data-new]',replayDurak);bind('[data-save-result]',()=>settle(s.game));bind('[data-game-settings]',()=>leave('room'));bind('[data-lobby]',()=>leave('lobby'));
      bindDurakCards();
      bind('[data-durak-help]',durakHelp);bind('[data-durak-tutor]',durakHelp);const pace=$('[data-pace]');if(pace)pace.onchange=()=>{s.durakPace=pace.value;save();clearDurakTimer();advance()};
    }
    // MAIN_GUIDES_START — short practice uses examples, never another player's hidden state.
    function mainGuideContent(mode,g){
      if(mode==='bunker')return {game:'bunker',title:'Бункер: понять свой выбор',context:bunkerGoal(g),sections:[
        {title:'Одна карта за раунд',text:'Свои шесть характеристик видишь заранее. Выбери одну закрытую карту и подтверди раскрытие. Затем по одной карте открывают живые боты. Раскрытие нельзя отменить.'},
        {title:'Как оценивать кандидатов',text:'Сравни только открытые характеристики. Польза карты: базовые очки, +2 при совпадении с потребностью сценария и +3 при совпадении с приоритетом раунда. Приоритет меняется каждый раунд. Баллы — подсказка о текущих потребностях, а не вероятность победы или раскрытие тайных карт.'},
        {title:'Выбор и подтверждение',text:'Нажми на кандидата, которого предлагаешь исключить, затем на «Подтвердить голос». За себя и выбывших голосовать нельзя. После отправки виден каждый реальный голос.'},
        {title:'Кто выходит и кто выигрывает',text:'Выбывает участник с наибольшим числом голосов. При равенстве игра случайно выбирает одного из лидеров, с одинаковыми шансами для каждого. Цель — остаться среди трёх кандидатов. Ход следующего раунда начинается только по твоей кнопке.'}
      ],lessons:[
        {id:'bunker-reveal',title:'Раскрытие',prompt:'Ты выбрал закрытую карточку профессии. Что произойдёт сейчас?',choices:[{label:'Карта откроется после кнопки «Раскрыть карту»',correct:true,feedback:'Верно. Выбор можно поменять до подтверждения. Остальные карты остаются закрыты.'},{label:'Сразу откроются все шесть характеристик',correct:false,feedback:'За раунд раскрывается только одна выбранная карта, после подтверждения.'},{label:'Карта уже стала видна соперникам',correct:false,feedback:'Первое нажатие только выбирает карту. Раскрытие выполняет отдельная кнопка.'}]},
        {id:'bunker-vote',title:'Голосование',prompt:'Ты нажал на карточку кандидата. Голос уже отправлен?',choices:[{label:'Нет, нужно нажать «Подтвердить голос»',correct:true,feedback:'Да. До подтверждения можно выбрать другого живого кандидата.'},{label:'Да, кандидат сразу выбывает',correct:false,feedback:'Сначала подтверди голос кнопкой, затем игра посчитает все голоса. Один твой голос не определяет итог автоматически.'}]},
        {id:'bunker-score',title:'Открытая польза',prompt:'У кандидата больше открытых баллов. Что это означает?',choices:[{label:'Открытые карты полезнее по текущим критериям',correct:true,feedback:'Верно. Это сумма по известным картам. Скрытые свойства не учитываются, решение голосования не гарантировано.'},{label:'Его скрытые карты тоже обязательно сильнее',correct:false,feedback:'Скрытые карты неизвестны. По открытой пользе нельзя узнать их содержание.'},{label:'Он обязательно выиграет голосование',correct:false,feedback:'Баллы помогают сравнивать. Боты могут голосовать иначе, а при равенстве голосов есть жеребьёвка.'}]}
      ]};
      const c=g?.players?.[0]?.hand?.[g.selected],status=g?durakStatus(g):null;
      return {game:'durak',title:'Дурак: понимать каждый ход',context:g?{title:c?'Почему подходит карта '+c.rank+c.suit:status[0],text:c?durakCardReason(c,g):status[1]}:{title:'Подготовь стол',text:'Выбери число ботов, сложность и ставку. Первый ход — у младшего козыря; если козырей нет ни у кого, начинает случайный игрок.'},sections:[
        {title:'Атака и защита',text:'На пустой стол атакующий кладёт любую свою карту. Защитник отвечает старшей картой той же масти или козырем. Козырь бьётся только старшим козырем. Нажатие на карту показывает причину, ход подтверждается отдельной кнопкой.'},
        {title:'Как подкинуть',text:'В этой версии подкидывает только атакующий. Достоинство должно совпасть с любой открытой картой на столе — атаки или защиты. Масть не важна. За раунд максимум шесть пар и не больше, чем было карт у защитника в начале.'},
        {title:'Бито или взять',text:'После успешной защиты атакующий может подкинуть или нажать «Бито»: карты сразу уходят в отбой, начинается новый заход. «Забрать карты» сразу переносит карты в твою руку и пропускает твою атаку. После решения взять подкидываний нет. Ходы соперников можно рассмотреть на столе и продолжить отдельной кнопкой.'},
        {title:'Новый раунд и победа',text:'Атакующий добирает первым, защитник — последним. Отбившийся начинает следующую атаку. Забравший пропускает её. Когда колода пуста, игроки без карт выходят; оставшийся с картами проигрывает. После твоего выхода боты доиграют автоматически, а журнал сохранит их ходы. Если карт нет ни у кого — ничья.'},
        {title:'Твой темп',text:'Можно остановить ботов кнопкой паузы. Открытие этой справки тоже ставит партию на паузу. После закрытия нажми «Продолжить игру», когда будешь готов. Журнал содержит только сыгранные карты и фактические действия.'}
      ],lessons:[
        {id:'durak-defense',title:'Защита',prompt:'Козырь — ♥. На столе атака 9♠. Какая карта её побьёт?',choices:[{label:'6♥',correct:true,feedback:'Верно. Любой козырь бьёт некозырную карту, даже если достоинство меньше.'},{label:'8♠',correct:false,feedback:'Масть подходит, но 8 младше 9. Нужна более старшая пика или козырь.'},{label:'A♦',correct:false,feedback:'Туз другой некозырной масти не подходит. Нужна старшая пика или черва.'}]},
        {id:'durak-add',title:'Подкидывание',prompt:'На столе 7♣, отбитая 10♣. Что может подкинуть атакующий?',choices:[{label:'10♦',correct:true,feedback:'Верно. Достоинство 10 уже есть на столе в защите. Масть при подкидывании не важна.'},{label:'9♣',correct:false,feedback:'Совпадение масти не помогает. Подходят только достоинства 7 или 10.'},{label:'Любой козырь',correct:false,feedback:'Даже козырь можно подкинуть только с достоинством, уже открытым на столе.'}]},
        {id:'durak-take',title:'Следующий раунд',prompt:'Защитник забрал карты. Кто начинает следующую атаку?',choices:[{label:'Следующий активный игрок после защитника',correct:true,feedback:'Верно. Забравший пропускает атаку. Игроки, уже вышедшие без карт, тоже пропускаются.'},{label:'Тот, кто забрал карты',correct:false,feedback:'Забравший пропускает следующую атаку. Начинает следующий активный игрок после него.'}]}
      ],walkthrough:durakWalkthrough()};
    }
    function openMainGuide(mode,initialTab){
      if(typeof mainWritable==='function'&&!mainWritable())return;
      if(!window.VEZDEHOT_GUIDE?.open)return;
      const game=mainGameKind(s.game)===mode?s.game:null,content=mainGuideContent(mode,game);
      clearDurakTimer();if(mainGameKind(s.game)==='durak'&&!s.game.over)s.game.paused=true;save();render();
      const trigger=document.querySelector(mode==='durak'?(initialTab==='walkthrough'&&s.view==='room'?'[data-durak-training]':s.view==='game'?'[data-durak-help]':'[data-help]'):'[data-help]');
      window.VEZDEHOT_GUIDE.open({...content,trigger,initialTab});
    }
    function durakHelp(){openMainGuide('durak')}
    function helpModal(){openMainGuide(s.view==='bunker'||s.room?.mode==='bunker'?'bunker':'durak')}
    // MAIN_GUIDES_END
    function settings(){window.VEZDEHOT.openAccount()}
    s=load();
    document.addEventListener('vezdehot:sessionpause',()=>{destroyDurakCards();clearDurakTimer();if(mainGameKind(s.game)==='durak'&&!s.game.over){s.game.paused=true;s.game.selected=null}save()});
    document.addEventListener('vezdehot:sessionlost',()=>{destroyDurakCards();accountChanging=true;clearDurakTimer();document.getElementById('app').inert=true});
    document.addEventListener('vezdehot:accountchange',()=>{destroyDurakCards();accountChanging=true;clearDurakTimer();if(s.game)s.game.paused=true;document.getElementById('app').style.pointerEvents='none'});
    document.addEventListener('vezdehot:profile',e=>{if(accountChanging)return;Object.assign(s,e.detail);if(s.view==='lobby')render();else if(s.view==='room')render()});
    window.addEventListener('beforeunload',()=>save());
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    if(s.game?.players?.[0]?.hand){normalizeDurakGame(s.game);if(s.game.over&&!s.game.settled)settle(s.game);save()}
    if(mainGameKind(s.game)==='bunker'&&s.game.over&&!s.game.settled)settleBunker(s.game);
    document.addEventListener('visibilitychange',()=>{if(document.hidden){clearDurakTimer();if(s.view==='game'&&s.game&&!s.game.over){s.game.paused=true;save()}}else if(s.view==='game')render()});
    render();
    if(s.view==='game')advance();
    const launch=new URLSearchParams(location.search);if(launch.get('view')==='lobby'){clearDurakTimer();s.view='lobby';save();render()}if(['durak','bunker'].includes(launch.get('game'))){const mode=launch.get('game');chooseMainRoom(mode);history.replaceState(null,'',location.pathname)}if(launch.get('profile')==='1')window.VEZDEHOT.openAccount();
  })();
