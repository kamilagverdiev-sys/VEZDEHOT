<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Вход · VEZDEHOT</title><link rel="stylesheet" href="./platform.css"><link rel="stylesheet" href="./session.css"><style>body{margin:0;background:#10121b;color:#f1eee5;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}main{width:min(420px,calc(100% - 32px));box-sizing:border-box;margin:24px 16px;padding:clamp(22px,6vw,32px);border:1px solid #49404d;border-radius:24px;background:linear-gradient(145deg,#231c2b,#14151e);box-shadow:0 24px 80px #0005}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.6;color:#a7a9b7;font-size:14px}#continue{text-decoration:none;margin-top:24px;min-height:48px;box-sizing:border-box;width:100%;justify-content:center}#continue:disabled{cursor:wait;opacity:.65}.mark{color:#d6edab;letter-spacing:2px;font-size:12px}</style></head><body><main><span class="mark">VEZDEHOT / АККАУНТ</span><h1 id="title">Завершаем вход…</h1><p id="status" role="status">Проверяем подтверждение. Это займёт несколько секунд.</p><button id="continue" type="button" class="vh-button primary" disabled aria-busy="true">Проверяем вход…</button></main><script src="./vendor/supabase-2.118.0.js"></script><script src="./auth-config.js"></script><script src="./session-validation.js"></script><script src="./game-store.js"></script><script src="./tab-session.js"></script><script src="./cloud-checkpoint.js"></script><script src="./platform.js"></script><script>
(()=>{
  const title=document.getElementById('title'),status=document.getElementById('status'),onward=document.getElementById('continue');
  onward.onclick=()=>{if(!onward.disabled)location.assign('./index.html')};
  const release=()=>{
    try{history.replaceState(null,'',location.pathname)}catch{}
    onward.disabled=false;onward.removeAttribute('aria-busy');onward.textContent='Перейти к играм →';
  };
  const fail=()=>{title.textContent='Вход не завершён';status.textContent='Не удалось проверить подтверждение. Вернись к играм и повтори вход.';release()};
  const finish=()=>{
    const a=VEZDEHOT.account();
    if(a.error){title.textContent='Вход не завершён';status.textContent=a.error+(a.user?' Ранее открытый аккаунт остаётся доступен.':' Вернись к играм и повтори вход.');release();return}
    title.textContent=a.user?'Ты в клубе':'Вход не завершён';
    status.textContent=a.user?(a.status==='saved'?'Аккаунт подключён. Профиль и сохранённые партии синхронизированы.':a.status==='conflict'?'Аккаунт подключён. Выбери облачную версию сохранений, чтобы продолжить.':'Аккаунт подключён. Открой профиль и проверь статус синхронизации перед переходом на другое устройство.'):'Подтверждение не получено. Начни вход заново в том же браузере или продолжи гостем.';
    release();
  };
  if(!window.VEZDEHOT){title.textContent='Не удалось загрузить вход';status.textContent='Обнови страницу при стабильном соединении или вернись к играм.';release();return}
  VEZDEHOT.ready.then(finish).catch(fail);
})();
</script></body></html>
