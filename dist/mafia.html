<script>
(function(){'use strict';
// MAFIA_ENGINE_START
var KEY='vezdehot_v2',GAME_VERSION=3,saved={},balance=10000,g=null,paused=false,accountChanging=false,boundSessionKey=null;
var botNames=['Луна','Рэй','Мила','Север','Тая','Марс'];
var roleInfo={mafia:{label:'Мафия',icon:'♠',team:'mafia',goal:'Добейся равенства мафии и мирных.'},detective:{label:'Комиссар',icon:'⌕',team:'town',goal:'Проверяй одну роль за ночь. Результат виден только тебе.'},doctor:{label:'Доктор',icon:'+',team:'town',goal:'Защити одного игрока на ночь. Можно выбрать себя.'},civilian:{label:'Мирный',icon:'◈',team:'town',goal:'Изучай голоса и помоги городу найти мафию.'}};
function platform(){return window.VEZDEHOT||null}
function profile(){var p=platform();if(p&&p.getProfile)return p.getProfile();try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function sessionKey(){if(!boundSessionKey)boundSessionKey='vezdehot_mafia_v3_'+(platform()?.scopeKey?.()||'guest');return boundSessionKey}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}

function syncProfile(){saved=profile()||{};balance=Number.isFinite(saved.balance)?saved.balance:10000;try{saved.mafiaDiff=localStorage.getItem(sessionKey()+'_difficulty')||saved.mafiaDiff||'normal'}catch(e){}}
function updateProfile(patch){if(accountChanging)return;var p=platform();if(p&&p.updateProfile){p.updateProfile(patch);syncProfile()}else{saved=Object.assign(profile(),patch);balance=Number.isFinite(saved.balance)?saved.balance:balance;localStorage.setItem(KEY,JSON.stringify(saved))}}
function saveState(){if(accountChanging)return;try{if(g)localStorage.setItem(sessionKey(),JSON.stringify(g));else localStorage.removeItem(sessionKey())}catch(e){}}
function log(text){g.log.unshift(text);g.log=g.log.slice(0,40)}
function commit(){saveState();render()}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function alive(){return g.players.filter(function(p){return p.alive})}
function mafiaAlive(){return alive().filter(function(p){return p.role==='mafia'}).length}
function townAlive(){return alive().length-mafiaAlive()}
function humanCanAct(){return !accountChanging&&!!g&&!g.over&&!paused&&g.players[0].alive}
function setMessage(text){g.message=text;commit()}
function endGame(team,reason){if(accountChanging||!g||g.over)return;g.over=true;g.phase='result';g.winningTeam=team;g.win=team===roleInfo[g.players[0].role].team;g.draw=team==='draw';g.resultReason=reason;g.message=reason;
 if(!g.settled){g.settled=true;var reward=g.draw?100:g.win?250:0,xp=g.draw?40:g.win?130:25;var p=platform();saveState();if(p&&p.recordResult){p.recordResult({id:g.id,game:'mafia',win:g.win,delta:reward,xp:xp});syncProfile()}else{updateProfile({balance:balance+reward,xp:(saved.xp||0)+xp,games:(saved.games||0)+1,wins:(saved.wins||0)+(g.win?1:0)})}}
 commit();}
function checkWin(){if(!g||g.over)return true;var m=mafiaAlive(),t=townAlive();if(m===0){endGame('town','Город нашёл всех участников мафии.');return true}if(m>=t){endGame('mafia','Мафии стало не меньше, чем мирных жителей.');return true}return false}
function newGame(){var roles=shuffle(['mafia','mafia','detective','doctor','civilian','civilian','civilian']);var players=Array.from({length:7},function(_,i){return{id:i,name:i===0?(saved.nick||'Игрок'):botNames[i-1],role:roles[i],alive:true,kind:i===0?'human':'bot'}});return{version:GAME_VERSION,id:'mafia-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),players:players,round:1,phase:'night',over:false,settled:false,nightTarget:null,dayTarget:null,votes:null,ballots:[],log:['Первая ночь. Город засыпает.'],privateNotes:[],knowledge:{},publicSuspicion:{},statements:[],message:'Выбери действие. Ночь закончится только после подтверждения.',nightText:'',revealed:[],lastDoctorTarget:{},diff:saved.mafiaDiff||'normal'}}
function start(){if(accountChanging)return;syncProfile();if(g&&!g.over)return; if(balance<100){render('Для входа нужно 100 V. Бонус доступен в лобби.');return}updateProfile({balance:balance-100});g=newGame();paused=false;commit()}
function reset(){if(accountChanging)return;if(g&&!g.over)return;g=null;paused=false;saveState();render()}
function targetable(p,kind,actor){if(!g||!p||!p.alive)return false;actor=actor||g.players[0];if(!actor.alive)return false;if(kind==='vote')return p.id!==actor.id;if(kind==='mafia')return p.role!=='mafia';if(kind==='detective')return p.id!==actor.id&&!g.knowledge[actor.id]?.[p.id];if(kind==='doctor')return true;return false}
function chooseNight(id){if(!humanCanAct()||g.phase!=='night')return;var me=g.players[0],p=g.players[id];if(!targetable(p,me.role,me))return;g.nightTarget=id;g.message='Выбран '+p.name+'. Подтверди действие, чтобы закончить ночь.';saveState();renderSelection()}
function chooseVote(id){if(!humanCanAct()||g.phase!=='vote'||!targetable(g.players[id],'vote',g.players[0]))return;g.dayTarget=id;saveState();renderSelection()}
function randomPick(list){return list.length?list[Math.floor(Math.random()*list.length)]:null}
function suspicion(voter,candidate){var known=g.knowledge[voter.id]?.[candidate.id];if(known)return known==='mafia'?100:-100;return g.publicSuspicion[candidate.id]||0}
function botChoice(bot,targets){var candidates=targets.filter(function(p){return p.id!==bot.id&&(bot.role!=='mafia'||p.role!=='mafia')});if(!candidates.length)return null;var error=g.diff==='easy'?.55:g.diff==='hard'?.1:.28;if(Math.random()<error)return randomPick(candidates);var ranked=candidates.map(function(p){return{p:p,score:suspicion(bot,p)+Math.random()*.65}}).sort(function(a,b){return b.score-a.score});return ranked[0].p}
function inspect(actor,target){if(!target)return;g.knowledge[actor.id]=g.knowledge[actor.id]||{};g.knowledge[actor.id][target.id]=target.role==='mafia'?'mafia':'town';if(actor.id===0)g.privateNotes.unshift('Ночь '+g.round+': '+target.name+' — '+(target.role==='mafia'?'мафия':'мирный житель')+'.')}
function resolveNight(){if(!g||g.over||paused||g.phase!=='night')return;var me=g.players[0],kill=null,heal=null,mafia=alive().filter(function(p){return p.role==='mafia'});var humanTarget=me.alive&&g.nightTarget!==null?g.players[g.nightTarget]:null;
 if(mafia.length){if(me.alive&&me.role==='mafia'&&humanTarget&&humanTarget.role!=='mafia')kill=humanTarget;else{var candidates=alive().filter(function(p){return p.role!=='mafia'});kill=candidates.map(function(p){return{p:p,score:-(g.publicSuspicion[p.id]||0)+Math.random()}}).sort(function(a,b){return b.score-a.score})[0]?.p||null}}
 var doc=alive().find(function(p){return p.role==='doctor'});if(doc){heal=doc.id===0?humanTarget:randomPick(alive());if(heal)g.lastDoctorTarget[doc.id]=heal.id}
 var detective=alive().find(function(p){return p.role==='detective'});if(detective){var toInspect=detective.id===0?humanTarget:randomPick(alive().filter(function(p){return targetable(p,'detective',detective)}));inspect(detective,toInspect)}
 if(kill&&heal&&kill.id===heal.id){g.nightText='Доктор предотвратил покушение. Все жители встретили рассвет.';log('Ночь '+g.round+': жертв нет. Защита доктора сработала.')}else if(kill){kill.alive=false;g.revealed.push(kill.id);g.nightText=kill.name+' не встретил рассвет. Роль: '+roleInfo[kill.role].label+'.';log('Ночь '+g.round+': выбыл '+kill.name+' ('+roleInfo[kill.role].label+').')}else{g.nightText='Этой ночью никто не погиб.';log(g.nightText)}
 g.nightTarget=null;g.phase='dawn';g.message=g.nightText;if(checkWin())return;commit();}
function confirmNight(){if(!g||g.over||paused||g.phase!=='night')return;var me=g.players[0];if(me.alive&&me.role!=='civilian'){var choices=alive().filter(function(p){return targetable(p,me.role,me)});if(choices.length&&(g.nightTarget===null||!targetable(g.players[g.nightTarget],me.role,me))){setMessage('Сначала выбери одного игрока.');return}}resolveNight()}
function beginDay(){if(!g||g.over||paused||g.phase!=='dawn')return;g.phase='day';g.statements=alive().filter(function(p){return p.id!==0}).map(function(p){var target=botChoice(p,alive());return{actor:p.id,target:target?.id??null,text:target?'Предлагает присмотреться к '+target.name+'.':'Пока не выдвигает подозрений.'}});g.message='Это мнения игроков, а не доказательства. Сравни их с прошлыми голосами.';commit()}
function beginVote(){if(!g||g.over||paused||g.phase!=='day')return;g.phase='vote';g.dayTarget=null;g.message=g.players[0].alive?'Выбери подозреваемого и подтверди голос.':'Ты наблюдаешь. Запусти голосование оставшихся игроков.';commit()}
function botVote(targets){var votes={};targets.forEach(function(p){votes[p.id]=0});var ballots=[];targets.filter(function(p){return p.id!==0}).forEach(function(bot){var pick=botChoice(bot,targets);if(pick){votes[pick.id]++;ballots.push({voter:bot.id,target:pick.id})}});return{votes:votes,ballots:ballots}}
function castVote(){if(!g||g.over||paused||g.phase!=='vote')return;var me=g.players[0];if(me.alive&&(g.dayTarget===null||!targetable(g.players[g.dayTarget],'vote',me))){setMessage('Выбери игрока для голосования.');return}var targets=alive(),result=botVote(targets);if(me.alive){result.votes[g.dayTarget]++;result.ballots.push({voter:0,target:g.dayTarget})}g.votes=result.votes;g.ballots=result.ballots;var highest=Math.max.apply(null,Object.values(g.votes));var tied=targets.filter(function(p){return g.votes[p.id]===highest});g.eliminated=null;
 if(tied.length===1){var out=tied[0];out.alive=false;g.revealed.push(out.id);g.eliminated=out.id;g.message=out.name+' исключён. Роль: '+roleInfo[out.role].label+'.';log('День '+g.round+': '+g.message);result.ballots.forEach(function(b){if(b.voter===out.id)return;var correction=b.target===out.id?(out.role==='mafia'?-1:.25):out.role==='mafia'?.35:0;g.publicSuspicion[b.voter]=Math.max(-2,Math.min(3,(g.publicSuspicion[b.voter]||0)+correction))});}
 else{g.message='Голоса разделились. Сегодня никто не исключён.';log('День '+g.round+': ничья голосов между '+tied.map(function(p){return p.name}).join(', ')+'.')}
 g.phase='voteResult';if(checkWin())return;commit();}
function continueAfterVote(){if(!g||g.over||paused||g.phase!=='voteResult')return;if(g.round>=25){endGame('draw','Город не пришёл к решению за 25 раундов. Ничья, ставка возвращена.');return}g.round++;g.phase='night';g.nightTarget=null;g.dayTarget=null;g.votes=null;g.message=g.players[0].alive?'Наступила новая ночь. Выбери действие.':'Ты наблюдаешь за новой ночью.';log('Ночь '+g.round+'. Город засыпает.');commit()}
function togglePause(){if(accountChanging||!g||g.over)return;paused=!paused;render()}
function restore(){syncProfile();try{var x=JSON.parse(localStorage.getItem(sessionKey())||'null');if(x&&x.version===GAME_VERSION&&Array.isArray(x.players)&&x.players.length===7&&['night','dawn','day','vote','voteResult','result'].includes(x.phase))g=x}catch(e){g=null}render()}
// MAFIA_ENGINE_END
function renderSelection(){
 var target=g.phase==='night'?g.nightTarget:g.dayTarget;
 document.querySelectorAll('[data-target]').forEach(function(e){var selected=+e.dataset.target===target;e.classList.toggle('selected',selected);e.setAttribute('aria-pressed',String(selected))});
 var note=document.querySelector('.selected-target');if(note)note.textContent=(g.phase==='night'?'Выбран: ':'Твой голос: ')+g.players[target].name;
 var action=document.querySelector(g.phase==='night'?'[data-night-confirm]':'[data-cast-vote]');if(action)action.disabled=false;
}
function top(){return '<header class="top"><a class="back" href="./index.html" aria-label="В лобби">‹</a><a class="brand" href="./index.html">VEZDEHOT</a><span class="subtitle">/ Мафия</span><div class="top-right"><span class="balance">'+fmt(balance)+'<span>V</span></span>'+(g&&!g.over?'<button class="icon-btn" data-pause aria-label="'+(paused?'Продолжить':'Пауза')+'">'+(paused?'▶':'Ⅱ')+'</button>':'')+'</div></header>'}
function phaseName(){return{night:'Ночь',dawn:'Рассвет',day:'Обсуждение',vote:'Голосование',voteResult:'Итоги голосов',result:'Финал'}[g.phase]||'Мафия'}
function phaseBar(){var order=['night','day','vote','voteResult'],at=g.phase==='dawn'?0:order.indexOf(g.phase);return '<nav class="phase-bar" aria-label="Этапы раунда">'+order.map(function(p,i){return '<div class="phase '+(i===at?'current':i<at?'done':'')+'"><i>'+(i+1)+'</i>'+['Ночь','Обсуждение','Голос','Итоги'][i]+'</div>'}).join('')+'</nav>'}
function initials(name){return esc(name.slice(0,2).toUpperCase())}
function playerGrid(){var me=g.players[0];return '<div class="players">'+g.players.map(function(p){var shown=g.over||!p.alive||p.id===0,ally=me.role==='mafia'&&p.role==='mafia',actionable=humanCanAct()&&((g.phase==='night'&&targetable(p,me.role,me))||(g.phase==='vote'&&targetable(p,'vote',me))),chosen=(g.phase==='night'?g.nightTarget:g.dayTarget)===p.id;var known=g.knowledge[0]?.[p.id];return '<button class="player '+(p.id===0?'you ':'')+(!p.alive?'dead ':'')+(actionable?'target ':'')+(chosen?'selected':'')+'" data-target="'+p.id+'" aria-pressed="'+chosen+'" aria-label="'+esc(p.name)+', '+(p.alive?'в игре':'выбыл')+(shown?', '+roleInfo[p.role].label:'')+'" '+(actionable?'':'disabled')+'><span class="seat-number">0'+(p.id+1)+'</span><span class="portrait">'+initials(p.name)+'</span><b>'+esc(p.name)+(p.id===0?' · ты':'')+'</b><small><i class="status-dot"></i>'+(p.alive?'В игре':'Выбыл')+'</small><div class="role-reveal">'+(shown?roleInfo[p.role].label:ally?'Твой союзник':known?(known==='mafia'?'Проверен: мафия':'Проверен: мирный'):'Роль скрыта')+'</div></button>'}).join('')+'</div>'}
function roleStrip(){var me=g.players[0],r=roleInfo[me.role];return '<div class="role-strip"><span class="role-icon">'+r.icon+'</span><div><b>'+r.label+'</b><small>'+r.goal+'</small></div>'+(!me.alive?'<span class="spectator">Наблюдатель</span>':'')+'</div>'}
function phasePanel(){var me=g.players[0],heading='',body='',button='',selected='';if(paused)return '<aside class="panel action-panel"><div class="eyebrow">ПАУЗА</div><h2>Город подождёт</h2><p>Партия сохранена на этом устройстве. Возвращайся, когда будешь готов.</p><div class="actions"><button class="btn primary" data-pause>Продолжить</button></div></aside>';
 if(g.phase==='night'){heading=me.alive&&me.role!=='civilian'?'Твоё ночное действие':'Город засыпает';body=me.alive?me.role==='civilian'?'У мирного нет ночного действия. Нажми кнопку, когда будешь готов встретить рассвет.':me.role==='detective'?'Выбери одного жителя. Роль откроется только после подтверждения.':me.role==='doctor'?'Выбери жителя для защиты. Можно защитить себя.':'Выбери мирного жителя для покушения. Союзники недоступны.':'Ты наблюдаешь. Решения этой ночью примут оставшиеся игроки.';selected=g.nightTarget!==null?'Выбран: '+g.players[g.nightTarget].name:'Выбор ещё не сделан';var needs=me.alive&&me.role!=='civilian'&&alive().some(function(p){return targetable(p,me.role,me)});button='<button class="btn primary" data-night-confirm '+(needs&&g.nightTarget===null?'disabled':'')+'>'+(needs?'Подтвердить действие':'Встретить рассвет')+'</button>';}
 else if(g.phase==='dawn'){heading='Ночь закончилась';body=g.nightText;button='<button class="btn primary" data-begin-day>Обсудить с городом</button>';}
 else if(g.phase==='day'){heading='Сопоставь версии';body=g.message;button='<button class="btn primary" data-begin-vote>К голосованию</button>';}
 else if(g.phase==='vote'){heading=me.alive?'Кого ты подозреваешь?':'Голосует город';body=me.alive?'Нажми на карточку жителя. До подтверждения голос можно изменить. При ничьей никто не выбывает.':'Выбывшие не голосуют. Можно наблюдать за решениями города.';selected=g.dayTarget!==null?'Твой голос: '+g.players[g.dayTarget].name:me.alive?'Выбери карточку жителя':'Режим наблюдения';button='<button class="btn danger" data-cast-vote '+(me.alive&&g.dayTarget===null?'disabled':'')+'>'+(me.alive?'Подтвердить голос':'Показать голоса')+'</button>';}
 else if(g.phase==='voteResult'){heading='Решение города';body=g.message;button='<button class="btn primary" data-next-night>Начать следующую ночь</button>';}
 var rows=g.phase==='voteResult'?Object.keys(g.votes||{}).map(function(id){return '<div class="vote-row"><span>'+esc(g.players[id].name)+'</span><b>'+g.votes[id]+' голос.</b></div>'}).join(''):'';
 return '<aside class="panel action-panel"><div class="eyebrow">'+(g.phase==='night'?'ЛИЧНОЕ РЕШЕНИЕ':'РАУНД '+g.round)+'</div><h2>'+heading+'</h2><p>'+esc(body)+'</p>'+(selected?'<div class="selected-target">'+esc(selected)+'</div>':'')+rows+'<div class="actions">'+button+'</div><div class="hint">Все этапы продолжаются по твоему нажатию.</div></aside>'}
function logs(){var statements=g.phase==='day'?'<div class="log-panel"><div class="section-title">Версии жителей <span>Могут ошибаться</span></div>'+g.statements.map(function(s){return '<div class="statement"><b>'+esc(g.players[s.actor].name)+'</b> · '+esc(s.text)+'</div>'}).join('')+'</div>':'';var ballots=g.ballots?.length&&['voteResult','result'].includes(g.phase)?'<details class="log-panel"><summary>Кто за кого голосовал</summary><div class="log">'+g.ballots.map(function(b){return '<div class="log-line">'+esc(g.players[b.voter].name)+' → '+esc(g.players[b.target].name)+'</div>'}).join('')+'</div></details>':'';return statements+ballots+(g.privateNotes.length?'<details class="log-panel" open><summary>Личный блокнот комиссара</summary><div class="log">'+g.privateNotes.map(function(t){return '<div class="log-line private">'+esc(t)+'</div>'}).join('')+'</div></details>':'')+'<details class="log-panel" open><summary>Хроника города</summary><div class="log">'+g.log.slice(0,10).map(function(t){return '<div class="log-line">'+esc(t)+'</div>'}).join('')+'</div></details>'}
function render(error){var app=document.getElementById('app');if(!app)return;var common=top();if(!g){app.innerHTML=common+'<div class="head"><div><div class="eyebrow">СОЦИАЛЬНАЯ ДЕДУКЦИЯ · СОЛО</div><h1>Доверяй. Проверяй.</h1><p>Семь жителей, четыре роли и город, которому нужен твой голос.</p></div></div>'+(error?'<div class="notice" role="alert">'+esc(error)+'</div>':'')+'<section class="panel start"><div class="start-copy"><div class="eyebrow">МАФИЯ</div><h2>У каждого есть секрет.</h2><p>Ночью действуют роли. Днём город строит версии и голосует. Здесь можно спокойно прочитать каждый результат.</p><div class="rules"><div class="rule"><b>07 жителей</b><span>Ты и шесть ботов</span></div><div class="rule"><b>04 роли</b><span>Два лагеря, общая цель</span></div><div class="rule"><b>Твой темп</b><span>Без спешки и таймеров</span></div></div><label class="subtitle">Уровень ботов <select data-diff aria-label="Уровень ботов" style="margin-left:8px;border:1px solid var(--line);padding:8px;border-radius:9px;background:#22273c;color:var(--text)">'+[['easy','Легко'],['normal','Обычно'],['hard','Сложно']].map(function(x){return '<option value="'+x[0]+'" '+((saved.mafiaDiff||'normal')===x[0]?'selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label><div class="actions"><button class="btn primary" data-start>Начать партию <span>100 V</span></button></div><div class="hint">При победе: возврат ставки и +150 V. Монеты игровые.</div></div><div class="start-art" aria-hidden="true"><div class="moon"></div><div class="skyline">'+[65,100,78,125,85,115,72].map(function(h){return '<i class="building" style="--h:'+h+'px"></i>'}).join('')+'</div><span class="case-label">NIGHT IN VEZDEHOT</span></div></section><div class="footer">Роль случайна · после выбывания можно наблюдать · прогресс сохраняется</div>';bind();return}
 var me=g.players[0],result=g.over?'<section class="result '+(!g.win&&!g.draw?'loss':'')+'"><div class="eyebrow">'+(g.draw?'НИЧЬЯ':g.winningTeam==='mafia'?'ПОБЕДИЛА МАФИЯ':'ПОБЕДИЛ ГОРОД')+'</div><h2>'+(g.draw?'Город не определился':g.win?'Твоя команда победила':'Партия окончена')+'</h2><p>'+esc(g.resultReason)+(g.draw?'<br>100 V возвращены':g.win?'<br>+150 V чистыми':'')+'</p><div class="actions"><button class="btn primary" data-new>Новая партия</button><a class="btn" href="./index.html">В лобби</a></div></section>':'';
 app.innerHTML=common+'<div class="head"><div><div class="eyebrow">МАФИЯ · '+(me.alive?'В ИГРЕ':'НАБЛЮДЕНИЕ')+'</div><h1>'+phaseName()+'</h1><p>'+(g.over?'Все роли раскрыты.':paused?'Партия приостановлена.':g.message)+'</p></div><div class="round">Раунд<strong>'+g.round+'</strong></div></div>'+result+(!g.over?phaseBar():'')+roleStrip()+'<div class="layout"><section class="panel table-panel"><h2 class="section-title">Жители города <span>'+alive().length+' в игре</span></h2>'+playerGrid()+'</section>'+(!g.over?phasePanel():'<aside class="panel action-panel"><div class="eyebrow">РАЗБОР ПАРТИИ</div><h2>Все карты раскрыты</h2><p>Посмотри, кто голосовал вместе, и сравни их голоса с настоящими ролями.</p></aside>')+'</div>'+logs()+'<div class="footer">'+(paused?'Пауза':'Автосохранение')+' · игровой режим без чата · решения ботов основаны на их роли и доступных сведениях</div>';bind();}
function bind(){var bindOne=function(selector,fn){var e=document.querySelector(selector);if(e)e.onclick=function(event){if(!accountChanging)fn(event)}};bindOne('[data-start]',start);bindOne('[data-new]',reset);bindOne('[data-pause]',togglePause);bindOne('[data-night-confirm]',confirmNight);bindOne('[data-begin-day]',beginDay);bindOne('[data-begin-vote]',beginVote);bindOne('[data-cast-vote]',castVote);bindOne('[data-next-night]',continueAfterVote);document.querySelectorAll('[data-target]').forEach(function(e){e.onclick=function(){if(g.phase==='night')chooseNight(+e.dataset.target);else if(g.phase==='vote')chooseVote(+e.dataset.target)}});var diff=document.querySelector('[data-diff]');if(diff)diff.onchange=function(){if(accountChanging)return;saved.mafiaDiff=diff.value;try{localStorage.setItem(sessionKey()+'_difficulty',diff.value)}catch(e){}}}
// BOOTSTRAP
Promise.resolve(platform()?.ready).then(restore).catch(restore);
window.addEventListener('beforeunload',saveState);
document.addEventListener('vezdehot:accountchange',function(){accountChanging=true;paused=true;var app=document.getElementById('app');app.inert=true;app.style.pointerEvents='none'});
document.addEventListener('vezdehot:profile',function(){if(accountChanging)return;syncProfile();var wallet=document.querySelector('.balance');if(wallet)wallet.innerHTML=fmt(balance)+'<span>V</span>'});
})();
