function roleStrip(){var me=g.players[0],ri=roleInfo[me.role],partner=me.role==='mafia'?g.players.filter(function(p){return p.role==='mafia'&&p.id!==0&&p.alive}).map(function(p){return p.name}).join(', '):'';return '<div class="role-strip"><div class="role-icon">'+ri.icon+'</div><div><b>Твоя роль: '+ri.label+'</b><small>'+esc(ri.goal)+(partner?'<br>Союзник: '+esc(partner):'')+'</small></div></div>'}
function phaseName(){return g.phase==='night'?'Ночь':g.phase==='day'?'День':g.phase==='vote'?'Голосование':g.phase==='voteResult'?'Итоги':'Финал'}
function phaseBar(){var order=['night','day','vote','voteResult'];var idx=order.indexOf(g.phase);return '<div class="phase-bar">'+['night','day','vote','voteResult'].map(function(x,i){return '<div class="phase '+(i===idx?'current ':i<idx?'done':'')+'">'+(x==='night'?'🌙 Ночь':x==='day'?'☀️ День':x==='vote'?'🗳️ Голос': '📜 Итоги')+'</div>'}).join('')+'</div>'}
function playerGrid(){var me=g.players[0];return '<div class="players">'+g.players.map(function(p){var roleShown=p.id===0||!p.alive||g.over;var selectable=(g.phase==='night'&&p.id!==0&&p.alive&&me.role!=='civilian'&&!(me.role==='mafia'&&p.role==='mafia'))||(g.phase==='vote'&&p.id!==0&&p.alive);var selected=(g.phase==='night'?g.nightTarget:g.dayTarget)===p.id;return '<article class="player '+(p.id===0?'you ':'')+(!p.alive?'dead ':'')+(selectable?'target ':'')+(selected?'selected':'')+'" '+(selectable?'data-target="'+p.id+'"':'')+'><div class="alive-dot"></div><div class="p-top"><span class="face">'+p.face+'</span><span class="p-name"><b>'+esc(p.name)+(p.id===0?' · ты':'')+'</b><small>'+ (p.alive?'в игре':'выбыл')+'</small></span></div>'+(roleShown?'<div class="role-reveal">'+roleInfo[p.role].icon+' '+roleInfo[p.role].label+'</div>':(p.role==='mafia'&&me.role==='mafia'?'<div class="role-reveal">🕶️ союзник</div>':'<div class="role-reveal" style="color:var(--muted)">роль скрыта</div>'))+'</article>'}).join('')+'</div>'}
function phasePanel(){var me=g.players[0];if(g.phase==='night'){var ri=roleInfo[me.role];if(me.role==='civilian')return '<div class="phase-panel"><h2>🌙 Город спит</h2><p>У мирного нет ночного действия. Собери наблюдения и дождись рассвета.</p><div class="actions"><button class="btn primary" data-night-confirm>Дождаться рассвета</button></div></div>';return '<div class="phase-panel"><h2>'+ri.icon+' Ночное действие</h2><p>'+esc(g.message||ri.goal)+'</p><div class="targets">'+cardTargets(me.role==='mafia'?'kill':me.role)+'</div><div class="actions"><button class="btn primary" data-night-confirm>Подтвердить действие</button></div></div>'}if(g.phase==='day')return '<div class="phase-panel"><h2>☀️ Обсуждение</h2><p>'+esc(g.nightText||'Сопоставь ночную улику с поведением игроков.')+'</p><div class="log">'+g.log.slice(0,3).map(function(x){return '<div class="log-line">'+esc(x)+'</div>'}).join('')+'</div><div class="actions"><button class="btn primary" data-begin-vote>К голосованию</button></div></div>';if(g.phase==='vote'){return '<div class="phase-panel"><h2>🗳️ Кого исключить?</h2><p>'+esc(g.message)+'</p><div class="targets">'+cardTargets('vote')+'</div><div class="actions"><button class="btn danger" data-cast-vote>Отдать голос</button></div></div>'}if(g.phase==='voteResult'){var rows=Object.keys(g.votes||{}).map(function(id){var p=g.players.find(function(x){return x.id===+id});return p?'<div class="log-line">'+p.face+' '+esc(p.name)+' — <b>'+g.votes[id]+' голос'+(g.votes[id]===1?'':'а')+'</b></div>':''}).join('');return '<div class="phase-panel"><h2>📜 Итоги голосования</h2><p>'+esc(g.message)+'</p><div class="log">'+rows+'</div><div class="actions"><button class="btn primary" data-next-night>Начать следующую ночь</button></div></div>'}return ''}
function tips(){var arr=[];if(g&&g.players[0].role==='detective'&&g.tips.length)arr.push('🔎 '+g.tips[0]);if(g&&g.phase==='night')arr.push('🌙 Ночью действие подтверждается один раз');if(g&&g.phase==='vote')arr.push('🗳️ Голосуй против игрока, чья история не сходится');if(g&&g.players[0].role==='mafia')arr.push('🕶️ Не выдавай союзника слишком ранней защитой');if(g&&g.players[0].role==='doctor')arr.push('🩺 Можно прикрыть себя');if(g&&g.players[0].role==='civilian')arr.push('🕯️ Следи за тем, кто меняет мнение');return '<div class="tips">'+arr.map(function(x){return '<span class="tip">'+esc(x)+'</span>'}).join('')+'</div>'}
function render(){var app=document.getElementById('app');if(!g){app.innerHTML='<div class="top"><a class="back" href="./index.html">‹ Лобби</a><div class="brand">VEZDEHOT</div><div class="grow"></div><div class="balance">'+fmt(balance)+' 🪙</div></div><div class="head"><div><div class="eyebrow">SOCIAL DEDUCTION · SOLO</div><h1>Мафия</h1><p>Скрытые роли, ночные решения и голосование против ботов.</p></div></div><div class="note">Ты и шесть персонажей. Найди мафию раньше, чем она получит большинство.</div><section class="board start"><span class="start-icon">🕶️</span><h2>Готов к первой ночи?</h2><p>Роль выдаётся случайно. Команда мирных победит, если найдёт всю мафию; мафия побеждает при равенстве с мирными.</p><div class="rule-grid"><div class="rule"><b>🌙 Ночь</b><span>Мафия атакует, комиссар проверяет, доктор лечит.</span></div><div class="rule"><b>☀️ День</b><span>Читай следы ночи и выбирай подозреваемого.</span></div><div class="rule"><b>🪙 Ставка</b><span>Вход 100 монет · победа +150 чистыми.</span></div></div><button class="btn primary" data-start>Начать партию · 100 🪙</button><div class="small" style="margin-top:10px">Подсказки включены · роли выбывших раскрываются</div></section>';var b=document.querySelector('[data-start]');if(b)b.onclick=start;return}var me=g.players[0],ri=roleInfo[me.role];if(g.over){app.innerHTML='<div class="top"><a class="back" href="./index.html">‹ Лобби</a><div class="brand">VEZDEHOT</div><div class="grow"></div><div class="balance">'+fmt(balance)+' 🪙</div></div><div class="head"><div><div class="eyebrow">МАФИЯ · ФИНАЛ</div><h1>Результат</h1><p>Партия завершена, все роли раскрыты.</p></div><div class="status">'+(g.win?'ПОБЕДА':'ПОРАЖЕНИЕ')+'<span>раунд '+g.round+'</span></div></div><section class="board">'+roleStrip()+playerGrid()+'<div class="result '+(g.win?'':'loss')+'"><h2>'+(g.win?'🎉 Город выжил':'💥 Тьма победила')+'</h2><p>'+esc(g.resultReason)+(g.win?'<br><b>+150 чистыми</b>':'')+'</p><div class="actions"><button class="btn primary" data-new>Новая партия</button><a class="btn" href="./index.html">В лобби</a></div></div></section>';var nb=document.querySelector('[data-new]');if(nb)nb.onclick=reset;return}var stage=phaseName();app.innerHTML='<div class="top"><a class="back" href="./index.html">‹ Лобби</a><div class="brand">VEZDEHOT</div><div class="grow"></div><div class="balance">'+fmt(balance)+' 🪙</div></div><div class="head"><div><div class="eyebrow">МАФИЯ · РАУНД '+g.round+'</div><h1>'+stage+'</h1><p>Семь игроков · два лагеря · один город</p></div><div class="status">'+(g.phase==='night'?'ГОРОД СПИТ':g.phase==='day'?'ОБСУЖДЕНИЕ':g.phase==='vote'?'ВЫБОР ЦЕЛИ':'ПРОТОКОЛ')+'<span>живых '+alive().length+' · мафии '+mafiaAlive()+'</span></div></div><div class="note">'+esc(g.message||'Смотри на подсказки и выбирай действие.')+'</div><section class="board">'+phaseBar()+roleStrip()+playerGrid()+phasePanel()+tips()+'</section>';bind()}
function bind(){document.querySelectorAll('[data-target]').forEach(function(el){el.onclick=function(){var id=+el.dataset.target;if(g.phase==='night')chooseNight(id);else if(g.phase==='vote'){g.dayTarget=id;render()}}});var b=document.querySelector('[data-night-confirm]');if(b)b.onclick=confirmNight;var bv=document.querySelector('[data-begin-vote]');if(bv)bv.onclick=beginVote;var cv=document.querySelector('[data-cast-vote]');if(cv)cv.onclick=function(){if(g.dayTarget===null){g.message='Выбери игрока, которого исключить.';render();return}castVote()};var nn=document.querySelector('[data-next-night]');if(nn)nn.onclick=continueAfterVote}
render();window.addEventListener('load',function(){initCloud()},{once:true});
})();
</script></body>
